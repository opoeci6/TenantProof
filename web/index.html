<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--topbar-h,0px))}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TenantProof</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: clinic case-file workspace. Sticky app bar; caseload table as home; numbered workflow rail inside a case; tenant intake shown in a phone frame. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#E9EEEC; --line:#D3DBD8;
  --ink:#16201D; --ink-2:#465450; --ink-3:#6A7773;
  --accent:#1D4F91; --accent-ink:#FFFFFF; --accent-soft:#E2EBF7;
  --ok:#2C6D45; --ok-soft:#E0F0E6; --warn:#8F5506; --warn-soft:#FAEED7; --bad:#A3241C; --bad-soft:#F8E2DF;
  --tag:#F6E7A8; --tag-ink:#4A3B00;
  --font-ui:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-mono:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1513; --surface:#161E1B; --surface-2:#1E2824; --line:#2D3935;
    --ink:#E5ECE9; --ink-2:#ADBAB5; --ink-3:#85928D;
    --accent:#8DB2EC; --accent-ink:#0C1830; --accent-soft:#1B2A41;
    --ok:#7FC897; --ok-soft:#1A2F22; --warn:#E8B166; --warn-soft:#382A13; --bad:#F2928A; --bad-soft:#3B1C19;
    --tag:#5A4B12; --tag-ink:#F8EBB8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#161E1B; --surface-2:#1E2824; --line:#2D3935;
  --ink:#E5ECE9; --ink-2:#ADBAB5; --ink-3:#85928D;
  --accent:#8DB2EC; --accent-ink:#0C1830; --accent-soft:#1B2A41;
  --ok:#7FC897; --ok-soft:#1A2F22; --warn:#E8B166; --warn-soft:#382A13; --bad:#F2928A; --bad-soft:#3B1C19;
  --tag:#5A4B12; --tag-ink:#F8EBB8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-size:.82em;font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-3);font-size:13px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:17px;text-decoration:none;color:var(--ink)}
.brand-mark{width:26px;height:26px;border-radius:5px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:800}
.ctx{display:flex;flex-direction:column;min-width:0;flex:1 1 240px}
.ctx strong{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.ctx span{font-size:12.5px;color:var(--ink-3)}
.topnav{display:flex;gap:2px;flex-wrap:wrap}
.topnav a{font-size:13.5px;font-weight:600;color:var(--ink-2);text-decoration:none;padding:6px 10px;border-radius:5px}
.topnav a:hover{background:var(--surface-2)}
.topnav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.topbar-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.demo-pill{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--tag);color:var(--tag-ink);padding:3px 8px;border-radius:3px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);position:relative;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ink-3);transition:transform .15s}
.switch input:checked{background:var(--accent-soft);border-color:var(--accent)}
.switch input:checked::after{transform:translateX(14px);background:var(--accent)}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding-block:22px 60px;display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;align-items:start}
.layout.single{grid-template-columns:minmax(0,1fr)}
/* tenant mode (/i/{token}): phone-only intake, no caseworker chrome */
body.tenant .view-head, body.tenant .intake-side, body.tenant details.contract, body.tenant #topnav, body.tenant label[for="devToggle"]{display:none}
body.tenant .intake-wrap{grid-template-columns:minmax(0,420px);justify-content:center}
.layout.single .rail{display:none}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topbar-h,61px) + 13px);display:flex;flex-direction:column;gap:2px}
.rail-back{font-size:13px;font-weight:600;text-decoration:none;color:var(--accent);padding:0 10px 10px}
.rail-sub{margin-top:14px}
.rail-label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:0 10px 8px}
.step-link{display:grid;grid-template-columns:26px 1fr;gap:2px 10px;align-items:start;padding:9px 10px;border-radius:var(--r);text-decoration:none;color:var(--ink);border:1px solid transparent}
.step-link:hover{background:var(--surface)}
.step-link[aria-current="page"]{background:var(--surface);border-color:var(--line)}
.step-no{grid-row:span 2;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.step-link[aria-current="page"] .step-no{border-color:var(--accent);color:var(--accent)}
.step-link.is-done .step-no{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.step-link.is-attn .step-no{border-color:var(--warn);color:var(--warn)}
.step-name{font-weight:600;font-size:14px}
.step-meta{font-size:12.5px;color:var(--ink-3)}
.step-link.is-attn .step-meta{color:var(--warn)}

main{min-width:0;display:flex;flex-direction:column;gap:20px}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.view-head h1{margin:0;font-size:26px;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
.view-head p{margin:4px 0 0;color:var(--ink-2);max-width:64ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-pad{padding:18px}
/* --- new case (#41) --- */
.new-case{display:grid;gap:12px;max-width:560px;margin:0 0 16px}.new-case label:not([hidden]){display:grid;gap:4px;font-weight:600;font-size:13.5px}.nc-actions{display:flex;gap:8px;flex-wrap:wrap}
/* --- end new case --- */
.note{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:var(--r);padding:10px 12px}
.note b{color:var(--ink)}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.note.bad{background:var(--bad-soft);color:var(--ink)}
.note-ico{flex:none;font-weight:800;width:18px;text-align:center}
.section-h{margin:4px 0 0;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{color:var(--ok)} .btn.bad{color:var(--bad)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* #90: the built package, right under the Build button */
.btn.big{padding:11px 20px;font-size:15px}
.pkg-result{display:grid;gap:12px;justify-items:start;border-color:var(--ok)}
.pkg-result.is-stale{border-color:var(--warn)}
.pkg-result h2{margin:0;font-size:16px}
.pkg-result p{margin:0}
.pkg-meta{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0;width:100%;font-size:13.5px}
.pkg-meta dt{color:var(--ink-3)}
.pkg-meta dd{margin:0;overflow-wrap:anywhere}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.plain::before{display:none}
.exhibit{display:inline-block;font-family:var(--font-mono);font-size:11.5px;font-weight:500;background:var(--tag);color:var(--tag-ink);padding:1px 6px;border-radius:3px;letter-spacing:.02em}

/* caseload */
.summary-row{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;color:var(--ink-2)}
.summary-row b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:18px;margin-right:4px}
.cl{display:flex;flex-direction:column}
.cl-head,.cl-row{display:grid;grid-template-columns:6px minmax(0,2.2fr) minmax(0,1.1fr) minmax(0,1.5fr) minmax(0,1fr) minmax(0,.8fr);gap:8px 16px;align-items:center}
.cl-head{padding:10px 18px 10px 0;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;border-bottom:1px solid var(--line)}
.cl-row{padding:0 18px 0 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.cl-row:last-child{border-bottom:0}
.cl-row:hover{background:var(--surface-2)}
.cl-row.demo{cursor:default;color:var(--ink-2)}
.cl-row.demo:hover{background:none}
.demo-tag{margin-left:8px;vertical-align:middle}
.cl-row > *{padding-block:13px}
.cl-stripe{align-self:stretch;padding:0!important;grid-row:span 2}
.cl-row.p-high .cl-stripe{background:var(--bad)}
.cl-who{display:flex;flex-direction:column;min-width:0}
.cl-who strong{font-size:14.5px}
.cl-who span{font-size:12.5px;color:var(--ink-3);overflow-wrap:break-word}
.cl-dead{font-size:13px;display:flex;flex-direction:column;gap:2px}
.cl-dead small{color:var(--ink-3);font-size:12px}
.cl-dead .soon{color:var(--bad);font-weight:700}
.cl-open{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.cl-reason{grid-column:2 / -1;font-size:12.5px;color:var(--ink-3);padding-top:0!important;margin-top:-8px}
.cl-row.p-high .cl-reason{color:var(--bad)}

/* evidence */
.drop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border:1.5px dashed var(--line);border-radius:var(--r);padding:16px 18px;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:0;font-size:13.5px;color:var(--ink-2)}
.drop strong{display:block;color:var(--ink);font-size:14.5px}
.file-in{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.intake-panel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 18px;align-items:center}
.intake-panel .ip-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.intake-panel .ip-title{font-weight:700}
.linkbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.linkbox .qr{width:132px;height:132px;flex:none;background:#fff;border:1px solid var(--line);border-radius:6px;image-rendering:pixelated}
.linkbox code{font-family:var(--font-mono);font-size:12px;background:var(--surface-2);padding:3px 8px;border-radius:4px;overflow-wrap:anywhere}
.ev-list{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.3fr) minmax(0,1fr);gap:8px 18px;padding:14px 18px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev-name{display:flex;flex-direction:column;gap:4px;min-width:0}
.ev-name .fn{font-weight:600;overflow-wrap:anywhere}
.ev-name .sub{font-size:12.5px;color:var(--ink-3)}
/* #97: photo previews (the copy without GPS) */
.ev-thumb,.src-thumb{display:block;width:max-content;padding:0;border:1px solid var(--line);border-radius:4px;background:var(--surface-2);cursor:zoom-in;overflow:hidden}
.ev-thumb img{display:block;max-width:120px;max-height:90px}
.src-thumb{margin:6px 0 2px}
.src-thumb img{display:block;max-width:160px;max-height:120px}
.modal-card.photo-card{height:auto;max-height:90vh}
.photo-wrap{flex:1;min-height:0;display:grid;place-items:center;padding:12px;overflow:auto;background:var(--surface-2)}
.photo-wrap img{max-width:100%;max-height:calc(90vh - 80px);object-fit:contain}
/* privacy:start (#60): personal details swapped for placeholders before the AI model sees them */
.privacy-panel h2{margin:0 0 4px;font-size:15.5px}
.privacy-panel p{margin:0;font-size:13.5px}
.pv-scroll{overflow-x:auto;margin:12px 0 4px}
.pv-table{width:100%;border-collapse:collapse;font-size:13px}
.pv-table th,.pv-table td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:middle}
.pv-table th{font-weight:600;color:var(--ink-3);border-top:0;white-space:nowrap}
.pv-table td:first-child{overflow-wrap:anywhere}
.pv-table .btn{white-space:nowrap}
.pv-table code,mark.ph{font-family:var(--font-mono);font-size:12px;background:var(--accent-soft);color:var(--ink);padding:1px 5px;border-radius:4px;white-space:nowrap}
.pv-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.pv-add label{width:100%;font-weight:600;font-size:13.5px}
.pv-add input{flex:1 1 220px;min-width:0}
.mt-body{flex:1;min-height:0;overflow:auto;padding:14px}
.mt-page{margin:0 0 14px}
.mt-page h3{font-size:12.5px;margin:0 0 4px;color:var(--ink-3);font-weight:600}
.mt-page pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--font-ui);font-size:13.5px;line-height:1.5;margin:0;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
/* privacy:end */
.kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 10px;font-size:12.5px;min-width:0;margin:0}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ev-checks{display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:12.5px}
.hash{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.copy{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0;font-weight:600}
.ev.is-new{background:var(--accent-soft)}

/* run */
.run-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.rs-unbuilt{color:var(--ink-3)}
.rs-unbuilt .rs-title{color:var(--ink-2)}
.send-hint{font-size:13px;margin:8px 0 0}
.run-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.run-steps{list-style:none;margin:0;padding:0}
.run-step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 14px;padding:16px 18px;border-top:1px solid var(--line)}
.run-step:first-child{border-top:0}
.rs-ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:1.5px solid var(--line);color:var(--ink-3)}
.rs-done .rs-ico{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.rs-running .rs-ico{border-color:var(--accent);color:var(--accent);animation:pulse 1s ease-in-out infinite}
.rs-needs_input .rs-ico,.rs-incomplete .rs-ico{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.rs-failed .rs-ico{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--accent-soft)}}
@media (prefers-reduced-motion: reduce){.rs-running .rs-ico{animation:none}}
.rs-title{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:600}
.rs-sum{color:var(--ink-2);font-size:13.5px;margin:2px 0 0}
.rs-last{color:var(--ink-3);font-size:12.5px;margin:3px 0 0;overflow-wrap:anywhere}
.ask{margin:0 0 14px;border-left:3px solid var(--warn)}
.ask h2{margin:0 0 6px;font-size:16px}
.ask-q{margin:0 0 12px;font-size:15px}
.ask label{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px}
.ask-row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.ask-row .field{flex:1 1 260px}
.ask-err{color:var(--bad);font-size:13.5px;margin:8px 0 0;min-height:1.3em}
.tools{grid-column:2;margin-top:6px}
.tools summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:600}
.tool-calls{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.tool-calls li{font-size:12.5px;background:var(--surface-2);border-radius:5px;padding:7px 10px;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 10px}
.tool-calls .t{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:500}
.tool-calls .io{overflow-wrap:anywhere;color:var(--ink-2)}
.tool-calls .io b{color:var(--ink);font-weight:600}

/* timeline */
.tl-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.meter{width:140px;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:96px;top:8px;bottom:8px;width:1.5px;background:var(--line)}
.tl-item{display:grid;grid-template-columns:84px minmax(0,1fr);gap:24px;padding:8px 0}
.tl-date{text-align:right;padding-top:15px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2);line-height:1.3}
.tl-date small{display:block;font-weight:500;color:var(--ink-3);font-size:11.5px}
.tl-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.tl-card::before{content:"";position:absolute;left:-17px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-3)}
.tl-item.st-accepted .tl-card::before,.tl-item.st-edited .tl-card::before{background:var(--ok);border-color:var(--ok)}
.tl-item.st-rejected .tl-card{opacity:.6}
.tl-item.st-rejected .tl-card::before{border-color:var(--bad)}
.tl-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.tl-title{font-weight:700;font-size:15px}
.tl-item.st-rejected .tl-title{text-decoration:line-through}
.tl-desc{margin:0;color:var(--ink-2);font-size:14px;max-width:70ch}
.cw-note{font-size:13px;background:var(--accent-soft);border-radius:5px;padding:7px 10px;color:var(--ink)}
.cw-note b{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-right:6px}

// - An F2 field with `when: [controller, value]` applies while the controller is empty or equals
//   that value (the server's F2_DEPENDENCIES, which the PDF uses, has the same rule).
// - A request (F3 tenant, F4 landlord) applies in its own role and when both its selection and

const requestSlots = new Map();

  return !slot.reason || selected(slot.selection);

async function sha256Hex(file) {
  try { const buf = await crypto.subtle.digest("SHA-256", await file.arrayBuffer()); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join(""); }
  catch { return "computed on server"; }
}
function formatCheck(name) {

  if (["jpg", "jpeg", "png", "bmp"].includes(ext)) return { kind: "photo", fc: { accepted: true, action: "none", note: `${ext.toUpperCase()} is an accepted format.` } };
  if (["heic", "heif"].includes(ext)) return { kind: "photo", fc: { accepted: true, action: "converted", note: "HEIC isn't an accepted format. Will convert to JPG." } };
  if (ext === "pdf") return { kind: "other", fc: { accepted: true, action: "none", note: "PDF is an accepted format." } };
  if (["doc", "docx", "xls", "xlsx"].includes(ext)) return { kind: "other", fc: { accepted: true, action: "none", note: "Word and Excel files are accepted." } };
  if (["txt", "csv", "eml"].includes(ext)) return { kind: "messages", fc: { accepted: true, action: "will_export_pdf", note: "Will be exported to PDF in the package." } };
  if (["mp4", "m4v", "wmv", "mpg", "mpeg"].includes(ext)) return { kind: "other", fc: { accepted: true, action: "none", note: "Video format accepted." } };
  if (["zip", "rar", "7z", "arc"].includes(ext)) return { kind: "other", fc: { accepted: false, action: "rejected", note: "Compressed files aren't accepted. Upload the files inside instead." } };
  return { kind: "other", fc: { accepted: false, action: "rejected", note: `.${ext || "?"} isn't an accepted format. Use JPG, PNG, PDF, Word, Excel or MP4.` } };
}

// What a step summary or a tool call says, in the words the caseworker sees: gap ids become the

  return outsideUrls(text, held => {
    let out = held;
    // A quoted id first, so a JSON value does not end up with doubled quotes.
    out = out.replace(/"gap_([0-9a-f]{2,})"/g, (_, id) => `"${titles.get(`gap_${id}`) || "a gap"}"`);

      const title = titles.get(`gap_${id}`);

    out = out.replace(/"run_[0-9a-f]{2,}"/g, '""').replace(RUN_ID_RE, "");

function viewRun() {

  const rs = runState(run, openItems(stats()));
  const runPill = `<span class="pill ${rs.pill[0]}">${rs.pill[1]}</span>`;
  // #175: summaries and tool calls say "Landlord's address for service", not gap_942b3e6f0f.
  // Plain text only: every use is still put through esc().
  const human = text => humanRunText(text, { fields: (S.form && S.form.fields) || [], gaps: S.gaps || [] });
  // #176: a running step shows it is alive: seconds since this page first saw it run, and the
  // tool call it is on now. The 1 s ticker updates only these spans.
  const stepPill = s => s.status === "running"
    ? `<span class="pill info" data-elapsed="${esc(s.key)}">Running · ${stepSeconds(run.id, s.key)} s</span>`
    : pill[s.status];
  const lastTool = s => {
    if (s.status !== "running" || !s.tool_calls.length) return "";
    const t = s.tool_calls[s.tool_calls.length - 1], out = human(t.output);
    return `<p class="rs-last">Last: <b>${esc(t.tool)}</b> → ${esc(out.length > 120 ? `${out.slice(0, 120).trimEnd()}…` : out)}</p>`;
  };
  // The runner builds `extract` and `timeline`; the other four steps are not built in this prototype,
  // whatever a seeded or real run says about them. (The mock run is a scripted demo and keeps its steps.)
  const unbuilt = s => !USE_MOCK && !BUILT.includes(s.key);
  const steps = run.steps.map((s, i) => unbuilt(s) ? `<li class="run-step rs-unbuilt"><span class="rs-ico">–</span>
      <div><div class="rs-title">${i + 1}. ${esc(s.label)} <span class="pill plain">Not in this prototype</span></div></div></li>`
    : `<li class="run-step rs-${s.status}"><span class="rs-ico">${ico[s.status] || i + 1}</span>
      <div><div class="rs-title">${i + 1}. ${esc(s.label)} ${stepPill(s)}</div>${s.summary ? `<p class="rs-sum">${esc(human(s.summary))}</p>` : ""}${lastTool(s)}</div>
      ${s.tool_calls.length ? `<details class="tools"${s.status === "needs_input" ? " open" : ""}><summary>${plural(s.tool_calls.length, "tool call")}</summary><ul class="tool-calls">${s.tool_calls.map(t => `<li><span class="t">${esc(t.tool)}</span><span class="io"><b>${esc(human(t.input))}</b> → ${esc(human(t.output))}</span></li>`).join("")}</ul></details>` : ""}</li>`).join("");
  const asking = askStep(run);
  const ask = asking ? `<form class="panel panel-pad ask" data-action="answer" aria-labelledby="ask-title" novalidate>
      <h2 id="ask-title">The agent has a question for you</h2>
      <p class="ask-q" id="ask-q">${esc(asking.summary || "The agent needs your answer to carry on.")}</p>
      <label for="ask-a">Your answer</label>
      <div class="ask-row"><input class="field" id="ask-a" name="answer" type="text" maxlength="500" autocomplete="off" aria-describedby="ask-q ask-help ask-err" aria-invalid="${S.askError ? "true" : "false"}" value="${esc(S.askDraft)}"><button class="btn primary" type="submit"${S.answering ? " disabled" : ""}>${S.answering ? "Sending…" : "Send"}</button>${asksHearing(asking) ? `<button class="btn" type="button" data-action="answer-none"${S.answering ? " disabled" : ""}>No hearing scheduled yet</button>` : ""}</div>
      <p class="muted" id="ask-help">Plain words are fine. If it asks for a date, write it like 2026-11-21 or Nov 21, 2026.${asksHearing(asking) ? " No date yet? Choose No hearing scheduled yet." : ""}</p>
      <p class="ask-err" id="ask-err" role="alert">${esc(S.askError)}</p>
    </form>` : "";
  const reviewLeft = rs.rail === "Needs review";
  const waiting = reviewLeft && !USE_MOCK ? `<div class="note"><span class="note-ico">i</span><span>The run has finished. Check the events on <a href="#timeline">Review timeline</a>. Steps marked "Not in this prototype" are not built yet.</span></div>` : reviewLeft ? `<div class="note warn"><span class="note-ico">!</span><span>The agent stopped at <b>Find missing information</b>. It drafted requests to the tenant in their language but sends nothing until you approve. It never decides the remedy. <a href="#gaps">Go to missing info</a></span></div>` : "";
  return `<div class="view-head"><div><h1>Agent run</h1><p>What the agent did, step by step, and which tools it used.</p></div><div class="btn-row">${run.status === "running" ? "" : briefButton()}<button class="btn" data-action="run" ${run.status === "running" ? "disabled" : ""}>Run analysis again</button></div></div>
    <div class="panel panel-pad run-head"><div class="btn-row"><span title="${esc(run.id)}">Analysis</span>${runPill}</div><div class="run-meta"><span>Started ${fmtTime(run.started_at)}</span><span>Finished ${fmtTime(run.finished_at)}</span>${run.usage ? `<span>Took ${fmtDur(run.usage.duration_ms)}</span><span title="${esc(costNote(run.usage))}">${esc(costLabel(run.usage))}</span>` : ""}</div></div>
    ${ask}${analysisNote(run)}${waiting}<ol class="panel run-steps">${steps}</ol>${contract("run", run)}`;
}

    const body = editing ? `<form class="edit-form" data-action="save-edit" data-id="${e.id}">

        <div class="btn-row"><button class="btn primary small" type="submit">Save</button><button class="btn small" type="button" data-action="cancel-edit">Cancel</button></div></form>`
      : `<p class="tl-desc">${esc(e.description)}</p>${e.caseworker_note ? `<div class="cw-note"><b>Note</b>${esc(e.caseworker_note)}</div>` : ""}`;
    const actions = e.review_status === "pending"

      : `<button class="btn small" data-action="review" data-id="${e.id}" data-status="pending">Undo</button>${e.review_status !== "rejected" ? `<button class="btn small" data-action="edit" data-id="${e.id}">Edit or add note</button>` : ""}`;
    return `<li class="tl-item st-${e.review_status}"><div class="tl-date">${esc(fmtDate(e.date))}<small>${esc(BASIS[e.date.basis] || "")}</small></div>
      <div class="tl-card"><div class="tl-top"><span class="tl-title">${esc(e.title)}</span><span class="chips">${actor[e.actor] ? `<span class="pill plain">${actor[e.actor]}</span>` : ""}${strengthPill[e.strength]}</span></div>
        ${body}<div class="chips"><span class="chips-label">Based on</span>${srcChips(e.sources)}</div>
        ${e.flags.length ? `<div class="flags">${e.flags.map(f => f.type === "conflict" ? `<span class="flag conflict"><span class="pill bad">Conflict</span>${esc(f.message)}</span>` : `<span class="flag">${esc(f.message)}</span>`).join("")}</div>` : `<div class="reasons">${esc(e.strength_reasons.join(" · "))}</div>`}
        ${editing ? "" : `<div class="tl-actions"><span class="state">${esc(stateTxt)}</span>${actions}</div>`}</div></li>`;
  }).join("");
  return `<div class="view-head"><div><h1>Review timeline</h1><p>The agent built this from the tenant's files. Check each event and add your professional notes. Only events you accept or edit go into the form draft.</p></div></div>
    <div class="tl-bar"><div class="progress"><span class="meter"><i style="width:${pct}%"></i></span>${st.reviewed} of ${st.total} reviewed</div>
      <div class="btn-row"><button class="btn small" data-action="accept-all">Accept all corroborated and single-source</button></div></div>
    <div class="note"><span class="note-ico">i</span><span><b>Strength is rule-based, not an AI guess.</b> Corroborated means two or more independent files agree. Needs support means the files are weak or disagree. <b>Accept all</b> leaves events that need support or have a conflict for you.</span></div>
    <ol class="tl">${items}</ol>${contract("timeline", S.timeline)}`;

/* #48: editRequest:start. The request to the tenant, editable before it is sent. The English is
   translated by one model call (POST /gaps/{id}/tenant-request/translate), or the caseworker writes
   the tenant's language themselves. Both go through the same checks as the agent's draft. */
function startDraft(g) {
  const r = g.tenant_request;
  S.drafting = g.id; S.draftError = "";
  S.draftEdit = { id: g.id, en: r.message_en, msg: r.message, pairEn: r.message_en, busy: false };
}
const isEnglish = lang => (lang || "").toLowerCase().split("-")[0] === "en";
const draftStale = d => d.en.trim() !== d.pairEn.trim();
function draftBox(g) {
  const d = S.draftEdit, lang = g.tenant_request.language, name = LANG_EN[lang] || lang, en = isEnglish(lang);
  const edited = d.en !== g.tenant_request.message_en || d.msg !== g.tenant_request.message;
  return `<div class="draft"><span class="draft-h">Request to ${esc(S.case.tenant.name)} · ${esc(langLabel(lang))} · ${edited ? "edited by you" : "written by the agent"}</span>
    <label class="draft-l">English${en ? "" : " (what you mean)"}<textarea class="field" id="draft-en-${g.id}" data-draft="en" maxlength="1500" rows="3" ${d.busy ? "readonly" : ""}>${esc(d.en)}</textarea></label>
    ${en ? "" : `<div class="btn-row"><button class="btn small" data-action="translate-draft" data-id="${g.id}" ${d.busy ? "disabled" : ""}>${d.busy ? "Translating…" : `Translate into ${esc(name)}`}</button></div>
    <label class="draft-l">${esc(name)} (what the tenant reads first)<textarea class="field" id="draft-msg-${g.id}" data-draft="msg" lang="${esc(lang)}" maxlength="3000" rows="3" ${d.busy ? "readonly" : ""}>${esc(d.msg)}</textarea></label>
    <p class="muted draft-stale" ${draftStale(d) ? "" : "hidden"}>You changed the English after the ${esc(name)} text was written. Translate again, or change the ${esc(name)} text yourself.</p>`}
    ${S.draftError ? `<div class="note bad"><span class="note-ico">×</span><span>${esc(S.draftError)}</span></div>` : ""}
    <p class="muted" style="margin:0">${en ? "The tenant reads this text." : `The tenant sees the ${esc(name)} text, with the English under “Show in English”.`} Quotes from the evidence must be word for word, in quotation marks.</p>
    <div class="btn-row"><button class="btn primary small" data-action="send-request" data-id="${g.id}" ${d.busy ? "disabled" : ""}>Approve and send through intake link</button><button class="btn small" data-action="cancel-draft">Cancel</button></div></div>`;
}
document.addEventListener("input", ev => {
  const t = ev.target, d = S.draftEdit;
  if (!t.dataset || !t.dataset.draft || !d) return;
  if (t.dataset.draft === "en") d.en = t.value;
  else { d.msg = t.value; d.pairEn = d.en; }  // written by hand: it now goes with this English
  const hint = t.closest(".draft") && t.closest(".draft").querySelector(".draft-stale");
  if (hint) hint.hidden = !draftStale(d);
});
async function translateDraft(id) {
  const d = S.draftEdit; if (!d || d.busy) return;
  d.busy = true; S.draftError = ""; render();
  const asked = d.en;  // the reply translates this English, even if the box changed meanwhile
  try { const r = await request("POST", `/gaps/${id}/tenant-request/translate`, { message_en: asked }); d.msg = r.message; d.pairEn = asked; }
  catch (err) { S.draftError = err.message; }
  d.busy = false; render();
}
async function sendDraft(id) {
  const d = S.draftEdit, g = S.gaps.find(x => x.id === id); if (!d || !g || d.busy) return;
  const en = isEnglish(g.tenant_request.language);
  if (!en && draftStale(d)) { S.draftError = "The English and the tenant's text no longer match. Translate again, or change the tenant's text, before sending."; render(); return; }
  d.busy = true; S.draftError = ""; render();
  try {
    await request("POST", `/gaps/${id}/tenant-request`, { message: en ? d.en : d.msg, message_en: d.en });
    S.drafting = null; S.draftEdit = null;
    // Without an intake link the tenant can't see the request yet: say what to do next.
    if (S.case && S.case.intake.status === "not_sent") toast("Added to the tenant's intake page. Send the intake link (on Evidence) so the tenant can see it.", 6000);
    else toast("Sent to the tenant's intake page");
    await refresh(["gaps", "intake", "activity"]);
  } catch (err) { d.busy = false; S.draftError = err.message; render(); }
}
/* editRequest:end */

/* #122: input controls for the form draft and its missing-info fields. */
const minTenancyDate = "1900-01-01";
const maxTenancyDate = `${new Date().getFullYear()}-12-31`;
const fieldMaxDate = key => leaseFields[key]?.date === "future" ? "9999-12-31" : maxTenancyDate;
function caseFieldAttrs(key) {
  if (leaseFields[key]?.date) return `type="date" min="${minTenancyDate}" max="${fieldMaxDate(key)}"`;
  if (leaseFields[key]?.money) return 'inputmode="decimal"';
  return partyFields[key]?.type ? `type="${partyFields[key].type}"` : "";
}
function validCaseField(key, value, saved) {
  if (!leaseFields[key]?.money || !value || value === saved) return true;
  const rent = /^(?:(CAD)[ \t]+)?\$?[ \t]*([0-9]+|[0-9]{1,3}(?:,[0-9]{3})+)(\.[0-9]{1,2})?(?:[ \t]+(CAD))?$/i.exec(value);
  if (!rent || (rent[1] && rent[4]) || !/[1-9]/.test(rent[2] + (rent[3] || ""))) {
    toast("Enter a positive amount in CAD, with up to two decimal places.", 6000);
    return false;
  }
  return true;
}

function viewGaps() {
  const src = id => S.sources.find(s => s.id === id);
  const gapCard = g => {

    // #172: the remedy is a choice; once the tenant was asked, their answer is recorded the same way.
    if ((open || g.status === "waiting_tenant") && g.input && g.input.type === "choice") input = `<form data-action="resolve-choice" data-id="${g.id}" style="display:grid;gap:10px"><span class="muted">Record the tenant's choice:</span><div class="choices">${g.input.options.map((o, i) => `<label><input type="checkbox" id="gap-${g.id}-${i}" name="opt" value="${esc(o)}">${esc(o)}</label>`).join("")}</div><div class="btn-row"><button class="btn primary small" type="submit">Save tenant's choice</button></div></form>`;
    const draft = open && g.tenant_request && S.drafting === g.id ? draftBox(g) : "";
    const status = g.status === "resolved" ? `<span class="pill ok">Resolved</span>` : g.status === "dismissed" ? `<span class="pill plain">Dismissed</span>` : g.status === "waiting_tenant" ? `<span class="pill info">Waiting for tenant</span>${S.case && S.case.intake.status === "not_sent" ? ` <a class="muted" href="#evidence">Intake link not sent yet</a>` : ""}` : g.severity === "blocking" ? `<span class="pill bad">Required</span>` : `<span class="pill warn">Suggested</span>`;
    const acts = [];

    if (open && g.severity === "recommended") acts.push(`<button class="btn small ok" data-action="gap" data-id="${g.id}" data-status="resolved">Mark done</button><button class="btn small" data-action="gap" data-id="${g.id}" data-status="dismissed">Dismiss</button>`);
    if (g.status === "waiting_tenant" && g.severity === "recommended") acts.push(`<button class="btn small ok" data-action="gap" data-id="${g.id}" data-status="resolved">Tenant replied · mark done</button>`);

      <div class="gap-top"><span class="gap-title">${esc(g.title)}</span>${status}</div>
      ${open ? `<p>${esc(g.why)}</p><p><b>How to fix:</b> ${esc(g.how_to_fix)}</p>` : g.resolution_note ? `<span class="resolved-note">${esc(g.resolution_note)}</span>` : ""}
      ${s && open ? `<p style="font-size:12.5px;color:var(--ink-3)">Source: ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}</p>` : ""}
      ${g.status === "waiting_tenant" && g.input && g.input.type === "text" ? `<form class="gap-input" data-action="resolve-text" data-id="${g.id}"><input class="field" id="gap-in-${g.id}" name="value" ${caseFieldAttrs(g.input.field_key)} placeholder="Enter the tenant's answer" required><button class="btn primary small" type="submit">Save answer</button></form>` : ""}
      ${g.answer ? `<div class="gap-answer"><span class="muted">Tenant's answer · ${esc(fmtTime(g.answer.received_at))}</span><blockquote>${esc(g.answer.text)}</blockquote>${englishToggle(g.answer.text, S.case.tenant.preferred_language)}</div>` : ""}
      ${input}${draft}${acts.length ? `<div class="btn-row">${acts.join("")}</div>` : ""}</div></div>`;

  const vs = { unchanged: `<span class="pill ok">Checked · unchanged</span>`, changed: `<span class="pill warn">Changed since saved</span>`, unreachable: `<span class="pill bad">Link unreachable</span>`, unverified: `<span class="pill plain">Not verified yet</span>` };
  return `<div class="view-head"><div><h1>Missing info</h1><p>Required items block the package. For anything only the tenant knows, the agent drafts a message in the tenant's language. You approve it before it's sent.</p></div></div>
    <section class="gap-group"><h2 class="section-h">Required</h2>${S.gaps.filter(g => g.severity === "blocking").map(gapCard).join("")}</section>
    <section class="gap-group"><h2 class="section-h">Suggestions to strengthen evidence</h2>${S.gaps.filter(g => g.severity === "recommended").map(gapCard).join("")}</section>

      <div class="note"><span class="note-ico">i</span><span>These are saved, word-for-word copies of official sources. A source check re-reads each official document and marks a source "Changed since saved" if its wording no longer matches; "Not verified yet" means no check has covered it yet. In this prototype the check is started by hand, not on every case, so confirm each source on its official page before you rely on it.</span></div></section>

function viewForm() {
  const f = S.form;
  const stPill = { auto_filled: `<span class="pill info">Filled from files</span>`, needs_confirmation: `<span class="pill warn">Please confirm</span>`, missing: `<span class="pill bad">Missing</span>`, user_entered: `<span class="pill ok">Entered by caseworker</span>` };
  const renderField = x => {
    const saved = x.value || "";
    const { date, options, money } = fieldControls[x.key] || {};
    const day = date ? new Date(saved + "T00:00:00Z") : null;
    const legacyDate = day && saved && (!/^(?!0000)\d{4}-\d{2}-\d{2}$/.test(saved)
      || !Number.isFinite(day.getTime()) || day.toISOString().slice(0, 10) !== saved
      || saved < minTenancyDate || saved > fieldMaxDate(x.key));
    const confirm = x.status === "needs_confirmation" && saved;
    // A partially typed native date can report an empty value. Its segments cannot be restored.
    const reenterDate = date && !landlordApplication() && S.draftSaves?.invalid.has(x.key)
      && S.draftSaves.attempted.get(x.key) === "";
    const displayed = reenterDate ? saved : draftFieldValue(x);
    const attrs = `class="field" id="fld-${esc(x.key)}" data-action="${date ? "date-field" : "field"}" data-key="${esc(x.key)}"${reenterDate ? " data-draft-reenter-date" : ""}`;
    const control = options
      ? `<select ${attrs}><option value="">Choose an answer</option>${Object.entries(options).map(([value, label]) =>
          `<option value="${value}" ${displayed === value ? "selected" : ""}>${label}</option>`).join("")}</select>`
      : `<input ${attrs} ${caseFieldAttrs(x.key)} value="${esc(legacyDate && displayed === saved ? "" : displayed)}" placeholder="${x.required && x.status === "missing" ? "Not found in the files" : ""}">`;
    return `<div class="frow"><label class="fl" for="fld-${esc(x.key)}">${esc(partyFields[x.key]?.label || x.label)}${money ? " (CAD)" : ""}${x.required ? "<small>Required</small>" : ""}</label>

        ${x.key === "applicant_email_consent" ? '<span class="muted">The applicant email appears in the draft PDF only if you select Yes.</span>' : ""}
        ${x.key === "tenancy_start" && saved && (legacyDate || x.status === "needs_confirmation") ? '<span class="muted">Previously recorded. Check whether this is the move-in date or the fixed-term start date.</span>' : ""}
        ${x.note ? `<span class="flag">${esc(x.note)}</span>` : ""}${x.sources.length ? `<div class="chips">${srcChips(x.sources)}</div>` : ""}</div>
      <div class="fs">${x.required || x.status !== "missing" ? stPill[x.status] : ""}${confirm ? `<button class="btn small" type="button" data-action="confirm-field" data-key="${esc(x.key)}">Confirm</button>` : ""}</div></div>`;
  };

  const groups = landlord ? [
    ["Landlord applicant", [...partyGroups[2][1], "applicant_email_consent"]],

    partyGroups[1],

  const partySections = groups.map(([title, keys]) => {

      ${applies(reason.key) ? `<label class="request-reason" for="fld-${reason.key}">Reason for ${title.toLowerCase()}
        <textarea class="field" id="fld-${reason.key}" data-action="field" data-key="${reason.key}" rows="3">${esc(draftFieldValue(reason))}</textarea></label>` : ""}
      ${key === "payment" && selected ? `<div class="request-options" role="group" aria-label="Payment options">${Object.entries(paymentOptions).map(renderRequest).join("")}</div>` : ""}
    </div>`;
  };
  const requestRows = Object.entries(landlord ? landlordRequests : tenantRequests).map(renderRequest).join("");
  const leaseRows = Object.keys(leaseFields).filter(applies)

  return `<div class="view-head" data-form-draft="${esc(CASE_ID)}"><div><h1>Form draft</h1><p>${esc(f.form_name)}. Review the details with the applicant before completing the official form.</p></div>

    </div>
    <div id="draft-save-notice">${draftSaveNotice()}</div>
    <div class="note warn"><span class="note-ico">!</span><span>${esc(f.disclaimer)}</span></div>
    ${partySections ? `<h2 class="section-h">Parties and premises (Form J F1)</h2>${partySections}` : ""}
    ${leaseRows ? `<h2 class="section-h">Lease information (Form J F2)</h2>

    ${rows || requestRows ? `<h2 class="section-h">${landlord ? "Landlord requests (Form J F4)" : "Tenant requests (Form J F3)"}</h2>` : ""}
    ${rows ? `<div class="panel form-grid">${rows}</div>` : ""}
    ${requestRows ? `<p class="muted">Select all requests that apply and explain each one. The applicant signs and dates the official Form J.</p>
      <div class="panel form-grid">${requestRows}</div>` : ""}
    ${landlord ? "" : `<h2 class="section-h">Details of the problem</h2>
    <div class="panel panel-pad" style="display:grid;gap:10px">${f.narrative.text ? `<p class="narr">${narrHtml}</p>` : `<p class="narr">No accepted events yet.</p>`}
      <span class="muted">Built from ${f.narrative.event_ids.length} accepted events. Caseworker notes are never included. ${left ? `<a href="#timeline">${left} ${left === 1 ? "event still needs" : "events still need"} review</a> and are left out.` : "All events reviewed."}</span></div>`}
    ${contract("form", f)}`;

/* #90: the result of a build, under the Build button. #201: it says so when the case changed after

function packageResult(p, changes = packageChangesAfter(p, S.activity)) {
  const zip = `Download the zip (v${p.version})`;
  const stale = changes.length > 0;
  const changed = changes.slice(0, 2).map(a => stripRunIds(a.action)).join("; ");
  return `<section class="panel panel-pad pkg-result${stale ? " is-stale" : ""}" id="pkg-result" aria-label="Built package">
    <h2>Package v${p.version} is ${stale ? "out of date" : "ready"}</h2>
    ${stale ? `<div class="note warn" role="status"><span class="note-ico">!</span><span>The case changed after v${p.version} was built (${esc(changed)}${changes.length > 2 ? `; +${changes.length - 2} more` : ""}). The v${p.version} zip stays unchanged for your records; build a new version to include the latest changes.</span></div>` : ""}
    ${USE_MOCK ? `<button class="btn ${stale ? "" : "primary "}big" type="button" disabled>${zip}</button>` : `<a class="btn ${stale ? "" : "primary "}big" id="pkg-download" href="${packageDownloadUrl(p.version)}" download>${zip}</a>`}
    <dl class="pkg-meta"><dt>Version</dt><dd>v${p.version}</dd><dt>Built by</dt><dd>${esc(p.built_by)}</dd><dt>Built</dt><dd>${fmtTime(p.built_at)}</dd><dt>SHA-256</dt><dd class="mono">${esc(p.sha256)}</dd></dl>
    <p class="muted">${USE_MOCK ? "In the real app this downloads as one zip, for the caseworker's records. The Program does not accept zip files: in the real app, each file can be downloaded from the table below and uploaded on its own." : "The zip is for your records. The Program does not accept zip files: download each file from the table below and upload it on its own."}</p></section>`;
}
function showPackageResult() {
  const panel = $("#pkg-result");
  if (!panel) return;  // the caseworker has moved to another page
  panel.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  const link = $("#pkg-download");
  if (link) link.focus({ preventScroll: true });
}

function viewPackage() {
  const st = stats(), ik = S.case.intake;
  const latest = latestPackage(S.pkg, S.activity), build = buildButton(latest);
  // #201: the case changed after the latest build, so the panel says it is out of date.
  const stale = latest ? packageChangesAfter(latest, S.activity).length > 0 : false;
  // #199: the versions kept for the record, newest first. The latest is what the panel above shows.
  const earlier = packageVersions(S.pkg, S.activity).slice(1);
  const doneRun = S.run && ["done", "needs_review"].includes(S.run.status) && S.run.finished_at;
  const acceptedN = S.timeline.filter(e => ["accepted", "edited"].includes(e.review_status)).length;
  // Same two reasons, same words, as the server's 409 (services/package.py).
  const noAnalysis = !doneRun ? "No analysis has been completed for this case yet. Run the analysis first." : !acceptedN ? "No timeline events have been accepted yet. Review the timeline first." : null;
  const ready = !noAnalysis && !st.blocking && !st.reqMissing && ik.tenant_attested_genuine;
  const draftBlock = draftPackageBlock();
  // #93: say how many events the build will leave out, before the caseworker clicks Build.
  const unreviewed = st.total - st.reviewed;
  const allAttest = Object.values(S.attest).every(Boolean);
  const ck = (ok, warn) => `<span class="ck ${ok ? "yes" : warn ? "maybe" : "no"}">${ok ? "✓" : warn ? "!" : "×"}</span>`;
  const pc = packageChecks(st), mark = { yes: "✓", no: "×", maybe: "!", none: "–" };
  const row = (c, label) => `<li><span class="ck ${c.state}">${mark[c.state]}</span><span>${label}: ${c.href ? `<a href="${c.href}">${esc(c.text)}</a>` : esc(c.text)}</span></li>`;
  const whoCls = { agent: "who-agent", tenant: "who-tenant", caseworker: "who-caseworker" };
  // Bug 11: an exhibit that couldn't be read and isn't in the zip, so the numbering's gap is explained.
  const unreadableLeftOut = p => {
    const inZip = new Set(p.files.map(f => f.label)), built = new Date(p.built_at);
    const out = S.evidence.filter(e => e.processing === "failed" && !inZip.has(e.label) && new Date(e.received_at) <= built);
    return out.length ? `<div class="note warn"><span class="note-ico">!</span><span>Not in the zip: ${out.map(e => `<span class="exhibit">${esc(e.label)}</span> ${esc(e.filename)}`).join(", ")}. ${out.length === 1 ? "This file" : "These files"} could not be read, so ${out.length === 1 ? "it" : "they"} could not be checked for location data. The evidence manifest says so too. Ask the tenant for a new copy if it matters.</span></div>` : "";
  };
  const fileCell = r => {
    if (USE_MOCK) return esc(r.filename);
    const path = r.filename.split("/").map(encodeURIComponent).join("/");
    return `<a href="${API_BASE}${C}/package/files/${path}?version=${S.pkg.version}" download>${esc(r.filename)}</a>`;
  };
  // #200: the ZIP panel and the contents table always describe the same version.
  const manifest = S.pkg && latest && S.pkg.version === latest.version ? `<h2 class="section-h">Package contents (v${S.pkg.version})</h2>
    <div class="panel tbl-wrap"><table class="manifest"><thead><tr><th>Exhibit</th><th>File</th><th>SHA-256</th><th>Note</th></tr></thead><tbody>${S.pkg.files.map(r => `<tr><td>${r.label === "—" ? "—" : `<span class="exhibit">${esc(r.label)}</span>`}</td><td>${fileCell(r)}</td><td class="mono">${esc(r.sha256.length === 64 ? r.sha256.slice(0, 16) + "…" : r.sha256)}</td><td>${esc(r.note)}</td></tr>`).join("")}</tbody></table></div>
    ${unreadableLeftOut(S.pkg)}
    <div class="panel panel-pad"><ul class="checklist">${S.pkg.reminders.map(r => `<li><span class="ck maybe">!</span>${esc(r)}</li>`).join("")}</ul></div>` : "";
  // #199: every version still kept, each with its own zip. Mock mode has no real zip to fetch.
  const earlierSection = earlier.length ? `<h2 class="section-h">Earlier versions</h2>
    <div class="panel tbl-wrap"><table class="manifest"><thead><tr><th>Version</th><th>Built</th><th>Built by</th><th>SHA-256</th><th><span aria-hidden="true"></span></th></tr></thead><tbody>${earlier.map(v => `<tr>
      <td>v${v.version}</td><td>${esc(fmtTime(v.built_at))}</td><td>${esc(v.built_by)}</td><td class="mono" title="${esc(v.sha256)}">${esc(v.sha256.slice(0, 12))}…</td>
      <td>${USE_MOCK ? `<button class="btn small" type="button" disabled>Download zip (v${v.version})</button>` : `<a class="btn small" href="${packageDownloadUrl(v.version)}" download>Download zip (v${v.version})</a>`}</td></tr>`).join("")}</tbody></table></div>` : "";
  return `<div class="view-head"><div><h1>Package</h1><p>Bundle the form draft, the evidence and a fingerprint log for filing. The tenant or the clinic files it. TenantProof never submits anything.</p></div>${briefButton()}</div>
    <div class="panel panel-pad"><ul class="checklist">
      <li>${ck(!noAnalysis)}<span>Analysis: ${noAnalysis ? `<a href="${doneRun ? "#timeline" : "#run"}">${esc(noAnalysis)}</a>` : "done, with accepted events"}</span></li>
      ${row(pc.missing, "Required missing info")}
      ${row(pc.fields, "Required form fields")}
      <li>${ck(ik.tenant_attested_genuine)}<span>Tenant confirmed the files are genuine${ik.tenant_attested_at ? ` (${fmtTime(ik.tenant_attested_at)}, intake link)` : ""}</span></li>
      ${row(pc.timeline, "Timeline review")}
      ${row(pc.suggestions, "Suggestions")}</ul></div>
    <form class="panel panel-pad attest" data-action="attest">
      <label><input type="checkbox" id="at-reviewed" name="reviewed_fields" ${S.attest.reviewed_fields ? "checked" : ""}>I reviewed every field and the summary.</label>
      <label><input type="checkbox" id="at-remedy" name="remedy_confirmed_with_tenant" ${S.attest.remedy_confirmed_with_tenant ? "checked" : ""}>The tenant confirmed what they are asking for.</label>
      <label><input type="checkbox" id="at-legal" name="explained_not_legal_advice" ${S.attest.explained_not_legal_advice ? "checked" : ""}>I told the tenant this package is prepared information, not a decision about their case.</label></form>
    ${S.pkgError ? `<div class="note bad"><span class="note-ico">×</span><span>${esc(S.pkgError)}</span></div>` : ""}
    ${analysisNote(S.run)}
    ${unreviewed ? `<div class="note warn"><span class="note-ico">!</span><span>${unreviewed === 1 ? "1 timeline event is not reviewed and is left out of the application draft" : `${unreviewed} timeline events are not reviewed and are left out of the application draft`}. <a href="#timeline">Review the timeline</a>.</span></div>` : ""}
    ${draftBlock ? `<div class="note warn" role="status"><span class="note-ico">!</span><span>${draftBlock} <a href="#form">Go to Form draft</a>.</span></div>` : ""}
    <div class="btn-row"><button class="btn${!latest || stale ? " primary" : ""}" data-action="build" ${ready && allAttest && !draftBlock ? "" : "disabled"}>${build.label}</button>${!ready ? `<span class="muted">${esc(noAnalysis || "Resolve the required items first.")}</span>` : !allAttest ? `<span class="muted">Tick all three confirmations.</span>` : build.hint && !draftBlock ? `<span class="muted">${esc(build.hint)}</span>` : ""}</div>
    ${latest ? packageResult(latest) : ""}
    ${manifest}
    ${earlierSection}
    <h2 class="section-h">Audit log</h2>
    <ul class="panel log">${S.activity.map(a => `<li><time>${fmtTime(a.at)}</time><span class="who ${whoCls[a.actor]}">${esc(a.actor)}</span><span>${esc(stripRunIds(a.action))}${a.actor !== "agent" ? ` <span class="muted">· ${esc(a.actor_name)}</span>` : ""}</span></li>`).join("")}</ul>
    ${contract("package", { request: { attestations: S.attest }, response: S.pkg, activity: S.activity })}`;
}

/* ---------- tenant intake ---------- */
/* #48: one request on the tenant page. On an English page it reads in English, with the tenant's
   language under a toggle; otherwise in the tenant's language, with the English under the toggle. */
function reqHtml(r, pageLang, tenantLang, t, vars) {
  const message = r.message ?? "", english = r.message_en || "";
  const flip = pageLang === "en" && english && !isEnglish(tenantLang);
  const [shown, shownLang, other, otherLang, label] = flip
    ? [english, "en", message, tenantLang, `Show in ${LANG_EN[tenantLang] || tenantLang}`]
    : [message, tenantLang, english, "en", t.showEn];
  const more = other && other !== shown ? `<details class="req-en"><summary>${esc(label)}</summary><p lang="${esc(otherLang)}">${esc(other)}</p></details>` : "";
  // #95: a short answer is optional, next to the upload. Only the real tenant page sends it.
  const answer = TENANT_MODE ? `<label class="answer-box"><span>${esc(t.answerLabel)}</span><textarea class="field" rows="2" maxlength="1000" data-action="intake-answer" data-id="${esc(r.id)}" placeholder="${esc(t.answerHint)}">${esc((S.intake.answers || {})[r.id] || "")}</textarea></label>` : "";
  return `<div class="req"><b>${esc(tpl(t.req, vars))}</b><span lang="${esc(shownLang)}">${esc(shown)}</span>${more}${answer}</div>`;
}
/* #48: above the preview, which language the tenant reads, and a one-click English view. */
function previewBar(v, lang) {
  if (TENANT_MODE || isEnglish(v.language)) return "";
  const btn = (k, text) => `<button class="btn small${lang === k ? " primary" : ""}" type="button" data-action="preview-lang" data-lang="${esc(k)}" aria-pressed="${lang === k}">${esc(text)}</button>`;
  const english = lang === "en";
  return `<div class="panel panel-pad preview-bar"><span class="ip-title">${esc(v.tenant_first_name)} reads this page in ${esc(langLabel(v.language))}</span>
    <div class="btn-row" role="group" aria-label="Preview language">${btn(v.language, `${LANG_EN[v.language] || v.language} (what ${v.tenant_first_name} sees)`)}${btn("en", "English (for you)")}</div>
    <span class="muted">${english ? `You are reading it in English. ${esc(v.tenant_first_name)}'s page opens in ${esc(LANG_EN[v.language] || v.language)}, with each request's English under “${esc((I18N[v.language] || I18N.en).showEn)}” (Show in English).` :`Switch to English to read the page and each request in English.`}</span></div>`;
}

// The language the tenant page shows: the one they picked, else the case's, else the browser's.

const intakeRemoveText = {

function viewIntake() {
  const v = S.intake.view; if (!v) return "<p>Loading…</p>";
  // #174: with no working link there is no case, so the browser's language picks the page's.

    document.documentElement.lang = lang;
    return `<div class="panel panel-pad" style="max-width:560px"><h1>${esc(t.deadTitle)}</h1><p>${esc(t.deadBody1)}</p><p>${esc(t.deadBody2)}</p></div>`;
  }
  if (v.loadFailed) return `<div class="panel panel-pad" style="max-width:560px"><h1>This page couldn't load</h1><p>Check your internet connection, then reload the page.</p><div class="btn-row"><button class="btn primary" type="button" data-action="reload">Reload</button></div></div>`;
  if (v.noLink && !S.case) return `<div class="view-head"><div><h1>Tenant view</h1><p>Open a case first: this page previews one case's tenant page.</p></div></div><div class="btn-row"><a class="btn primary" href="#cases">Go to the caseload</a></div>`;

  const lang = tenantLang(), t = I18N[lang], vars = { org: v.org_name, unit: v.unit };
  const reqs = v.requests.map(r => reqHtml(r, lang, v.language, t, vars)).join("");  /* #48: the English too */
  const body = S.intake.sent ? `<div class="done">${esc(tpl(t.sent, vars))}</div>` : `
      <p>${esc(tpl(t.intro, vars))}</p>${reqs}

      ${UPLOADS_ENABLED ? `<label class="up" for="intakeFiles"><input class="file-in" type="file" id="intakeFiles" multiple accept="${UPLOAD_ACCEPT}"${S.intake.submitting ? " disabled" : ""}>${S.intake.files.length ? esc(tCount(t, S.intake.files.length)) : esc(t.choose)}</label>${selectedIntakeFiles(lang)}` : `<p class="muted">${esc(UPLOAD_SOON[lang] || UPLOAD_SOON.en)}</p>`}
      <p style="font-size:13px">${esc(tpl(t.privacy, vars))}</p>
      <form class="attest" data-action="intake-attest">
        <label><input type="checkbox" id="in-attest" name="attest" ${S.intake.attest ? "checked" : ""}>${esc(t.attest)}</label>
        <label><input type="checkbox" id="in-consent" name="consent" ${S.intake.consent ? "checked" : ""}>${esc(tpl(t.consent, vars))}</label></form>
      ${(() => { const answered = Object.values(S.intake.answers || {}).some(v => (v || "").trim());
        const ok = (S.intake.files.length || answered || !UPLOADS_ENABLED) && S.intake.attest && S.intake.consent;
        return `<button class="btn primary" data-action="intake-send" ${ok ? (S.intake.submitting ? "disabled" : "") : `disabled aria-describedby="send-hint"`}>${esc(tpl(t.send, vars))}</button>${ok ? "" : `<p class="muted send-hint" id="send-hint">${esc(t.sendHint)}</p>`}`; })()}`;
  const link = TENANT_MODE ? null : sessionLink(S.lastLink, CASE_ID);  // Fix #38: the link just sent, for this case only
  const qr = TENANT_MODE ? null : sessionQr(S.lastLink, CASE_ID);
  return `<div class="view-head"><div><h1>Tenant view</h1><p>What ${esc(v.tenant_first_name)} sees after opening the intake link on a phone. No account needed. It opens in the tenant's preferred language, and the tenant never sees the caseworker workspace.</p></div></div>
    ${link ? `<div class="panel panel-pad intake-panel"><div class="ip-main"><span class="ip-title">Intake link for ${esc(v.tenant_first_name)}</span><span class="muted">Copy it now and send it to the tenant, or let them scan the QR code with their phone. For security it is shown only until you reload this page or send a link for another case; after that, re-sending makes a new link and the old one stops working.</span>${linkBox(link, qr)}</div></div>` : ""}
    <div class="intake-wrap">
      <div class="intake-side">

        <div class="note"><span class="note-ico">i</span><span>Requests you approve on <a href="#gaps">Missing info</a> appear on this page. Files sent here show up in the case as <b>Uploaded by tenant</b>.</span></div>
        <div class="note"><span class="note-ico">i</span><span>The six languages in this prototype are examples. Agent-drafted requests are written in the tenant's language by the model; fixed page text should be checked by a native speaker.</span></div>
        ${S.intake.sent ? `<div class="btn-row"><a class="btn" href="#evidence">See the files in the case</a><button class="btn" data-action="intake-reset">Reset tenant view</button></div>` : ""}
      </div>
      <div class="phone" lang="${esc(lang)}">
        <div class="phone-top"><span class="phone-org">${esc(v.org_name)}</span><label class="muted" for="intakeLang">${esc(t.lang)} <select class="lang" id="intakeLang">${Object.keys(I18N).map(k => `<option value="${k}" ${k === lang ? "selected" : ""}>${LANGS[k]}</option>`).join("")}</select></label></div>

const VIEWS = { cases: viewCases, intake: viewIntake, evidence: viewEvidence, run: viewRun, timeline: viewTimeline, gaps: viewGaps, form: viewForm, package: viewPackage };
function render() {
  if (S.needLogin) return showLogin();
  if (!TENANT_MODE && !CASE_ID && route() !== "cases") { location.hash = "cases"; return; }  // hashchange re-renders
  const r = route();
  if (!TENANT_MODE && landlordApplication() && ["run", "timeline", "gaps", "package", "intake"].includes(r)) {
    location.hash = "form";
    return;
  }
  renderChrome();
  const here = S.cases.find(x => x.id === CASE_ID);
  const banner = !landlordApplication() && CASE_ROUTES.includes(r) && here && here.analysed === false ? `<div class="note warn" role="status"><span class="note-ico">!</span><span><b>Not analysed yet.</b> No analysis has been completed and no events are reviewed, so nothing here is ready to file. <a href="#run">Run the analysis</a></span></div>` : "";
  const view = $("#view");
  if (r === "form" && view.querySelector("[data-form-draft]")?.dataset.formDraft === CASE_ID) {
    /* #161, #182: refresh the current draft without replacing the focused control. */
    const active = document.activeElement;
    const editing = active?.matches('textarea[data-action="field"], input[data-action="field"]:not([type="checkbox"]), input[data-action="date-field"]');
    const focused = active !== view && view.contains(active) && active.id ? active : null;
    const saves = S.draftSaves;
    const mode = formRefreshMode({ focused: !!focused, composing: formComposing, downloading: !!saves?.downloading,
      unsaved: !!(saves?.pending.size || saves?.failed.size || saves?.invalid.size) });
    formRenderDeferred = mode === "after-composition";
    if (mode === "skip" || mode === "after-composition") {
      const notice = $("#draft-save-notice");
      if (notice) notice.innerHTML = draftSaveNotice();
      return;
    }
    // A focused text field missing from the new view keeps the old view, so its text is not lost.
    if (mode === "keep-focus" && (renderAroundFocus(view, focused, banner + VIEWS[r]()) || editing)) return;
  }
  view.innerHTML = (r === "cases" ? S.casesLoaded : r === "intake" ? S.intake.view : S.form) ? banner + VIEWS[r]() : `<p>Loading…</p>`;
  if (r === "evidence") wireDrop();
}

/* ---------- data loading ---------- */
let C = `/cases/${CASE_ID}`;
/* caseInUrl:start: the open case is kept in the address (?case=<id>), so a refresh stays on it */
const caseInUrl = () => USE_MOCK || TENANT_MODE ? null : new URLSearchParams(location.search).get("case");
function writeCaseToUrl(id) {
  if (USE_MOCK || TENANT_MODE) return;
  const url = new URL(location.href);
  if (id) url.searchParams.set("case", id); else url.searchParams.delete("case");
  if (url.href !== location.href) history.replaceState(history.state, "", url);
}
/* caseInUrl:end */
const setCase = id => {
  CASE_ID = id;
  C = `/cases/${id}`;
  S.draftSaves = tenantDraftSavesByCase.get(id) ?? null;
  tenantDraftSavesByCase.delete(id);
  writeCaseToUrl(id);
};
// The server returns the raw link only from POST /intake-link, so a caseworker can preview
// the tenant view only after sending a link in this session.
const tokenOf = url => (url ? url.split("/").pop() : null);
const intakeTok = () => INTAKE_TOKEN || tokenOf(sessionLink(S.lastLink, CASE_ID) || (S.case && S.case.intake.url));
const LOADERS = {
  me: () => request("GET", "/me").then(d => S.me = d),
  cases: () => request("GET", "/cases").then(d => { S.cases = prioritizeClient(d); S.casesLoaded = true; }),
  case: () => request("GET", C).then(d => S.case = d),
  evidence: () => request("GET", `${C}/evidence`).then(d => S.evidence = d),
  privacy: () => request("GET", `${C}/privacy`).then(d => S.privacy = d).catch(() => S.privacy = null),  /* #60 */
  run: async () => {
    const caseId = CASE_ID;
    const run = await request("GET", `${C}/runs/latest`).catch(() => null);
    if (CASE_ID === caseId) S.run = run;
  },
  timeline: () => request("GET", `${C}/timeline`).then(d => S.timeline = d),
  gaps: () => request("GET", `${C}/gaps`).then(d => S.gaps = d),
  sources: () => request("GET", `${C}/sources`).then(d => S.sources = d),
  form: () => request("GET", `${C}/form-draft`).then(d => S.form = d),
  activity: () => request("GET", `${C}/activity`).then(d => S.activity = d),
  // #200: the built package, so a reload or a case switch keeps its contents and file links.
  // 404 (nothing built yet) and 409 (a landlord case) mean "no package", not a failed load.
  pkg: async () => {
    const caseId = CASE_ID;
    try {
      const pkg = await request("GET", `${C}/package`);

  const f = ev.target; if (!f.dataset.action) return; ev.preventDefault();

  if (a === "create-case") return createCase(f);  /* #41 */
  if (a === "privacy-add") {  /* #60 */
    const fd = new FormData(f), value = String(fd.get("value") || "").trim();
    if (value.length < 2) { toast("Type at least 2 characters."); return; }
    await savePrivacyTerm({ value, action: "hide", role: fd.get("role") }, "Hidden from the AI model.");
    const el = document.getElementById("pv-value"); if (el) el.focus();
    return;
  }
  if (a === "login") {
    const fd = new FormData(f);
    try { S.me = await request("POST", "/auth/login", { email: fd.get("email"), password: fd.get("password") }); S.needLogin = false; await ensureCase(); await refresh(); location.hash = "cases"; }
    catch (err) { showLogin(err.status === 429 ? "Too many attempts. Wait a minute and try again." : err.message); }
    return;
  }
  if (a === "answer") return sendAnswer(new FormData(f).get("answer").trim());
  if (a === "save-edit") {
    const fd = new FormData(f), date = fd.get("date"), ex = S.timeline.find(e => e.id === id);
    await request("PATCH", `/timeline/${id}`, { review_status: "edited", title: fd.get("title"), description: fd.get("description"), caseworker_note: fd.get("caseworker_note").trim() || null, date: date ? { value: date, precision: "day", basis: "user" } : ex.date });
    S.editing = null; toast("Saved"); await refresh(["timeline", "form"]);
  }
  if (a === "resolve-text") { const v = new FormData(f).get("value").trim(); if (!v || !validCaseField(S.gaps.find(gap => gap.id === id)?.input?.field_key, v)) return; await request("PATCH", `/gaps/${id}`, { status: "resolved", value: v, resolution_note: `Saved: ${v}` }); toast("Saved to the form draft"); await refresh(["gaps", "form", "intake"]); }
  if (a === "resolve-choice") { const v = new FormData(f).getAll("opt"); if (!v.length) { toast("Pick at least one option"); return; } await request("PATCH", `/gaps/${id}`, { status: "resolved", value: v.join("; "), resolution_note: `Tenant's choice: ${v.join("; ")}` }); toast("Saved to the form draft"); await refresh(["gaps", "form"]); }
}));
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.dataset?.draftReenterDate !== undefined) delete t.dataset.draftReenterDate;
  if (!t.dataset || t.dataset.action !== "intake-answer") return;
  S.intake.answers = S.intake.answers || {};
  S.intake.answers[t.dataset.id] = t.value;
  const btn = document.querySelector('[data-action="intake-send"]');
  if (btn) {
    const answered = Object.values(S.intake.answers).some(v => (v || "").trim());
    btn.disabled = !!S.intake.submitting || !((S.intake.files.length || answered || !UPLOADS_ENABLED) && S.intake.attest && S.intake.consent);
  }
});
/* A native date emits change while the user is still editing its individual segments. */
document.addEventListener("focusout", guarded(async ev => {
  const input = ev.target;
  const { action, key } = input.dataset;
  if (input.contains(ev.relatedTarget)) return;
  const state = S.draftSaves;
  if (action === "field" && (state?.failed.has(key) || state?.invalid.has(key))
      && !state.pending.has(key)) {
    return saveDraftControl(input);
  }
  if (action !== "date-field" || input.dataset.draftReenterDate !== undefined) return;
  const dateState = draftSaveState();
  if (!input.reportValidity()) {
    dateState.invalid.add(key);
    dateState.attempted.set(key, input.value);
    if (!landlordApplication()) render();
    return;
  }
  dateState.invalid.delete(key);
  const pending = dateState.pending.get(key);
  const saved = pending?.value ?? dateState.confirmed.get(key) ?? input.defaultValue;
  if (dateState.failed.has(key) && !pending) return saveDraftField(key, input.value);
  if (input.value === saved) {
    if (!pending) dateState.attempted.delete(key);
    if (!landlordApplication() && route() === "form" && $("#draft-save-notice")) {
      $("#draft-save-notice").innerHTML = draftSaveNotice();
    }
    return;
  }
  await saveDraftField(key, input.value);
}));
document.addEventListener("change", guarded(async ev => {
  const t = ev.target;
  const newCase = t.closest("form.new-case");
  if (t.name === "applicant_role" && newCase) {
    const language = newCase.elements.namedItem("tenant_language");
    const landlord = t.value === "landlord";
    language.disabled = landlord;
    language.closest("label").hidden = landlord;
    return;
  }
  if (t.id === "devToggle") { document.body.classList.toggle("dev", t.checked); try { localStorage.setItem("tp-dev", t.checked ? "1" : "0"); } catch {} return; }
  if (t.dataset.action === "field") return saveDraftControl(t);
  if (t.closest("form[data-action=attest]")) { S.attest[t.name] = t.checked; S.pkgError = null; render(); }
  if (t.closest("form[data-action=intake-attest]")) { S.intake[t.name] = t.checked; render(); }
  if (t.id === "intakeLang") { S.intake.lang = t.value; if (TENANT_MODE) try { localStorage.setItem("tp-intake-lang", t.value); } catch {} render(); }  // bug 8: kept after a reload
  if (t.id === "intakeFiles" && t.files.length) { S.intake.files = [...t.files]; render(); }
  if (t.id === "fileIn" && t.files.length) handleFiles(t.files);
}));
async function handleFiles(files) {
  try { await uploadFiles(`${C}/evidence`, [...files]); } catch (err) { toast(err.message); return; } /* WS1: an error toast is not overwritten */
  toast(`${plural(files.length, "file")} added. ${landlordApplication() ? "The draft PDF will list them." : "Run the analysis again to include them."}`);
  await refresh(["evidence", "privacy"]);
}
function wireDrop() {
  const d = $("#drop"); if (!d) return;
  d.addEventListener("dragover", e => { e.preventDefault(); d.classList.add("over"); });
  d.addEventListener("dragleave", () => d.classList.remove("over"));
  d.addEventListener("drop", e => { e.preventDefault(); d.classList.remove("over"); if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
}
window.addEventListener("hashchange", () => { S.editing = null; S.drafting = null; render(); window.scrollTo({ top: 0 }); });
/* #179: --topbar-h is the sticky top bar's height, used by scroll-padding-top and the rail, so anything
   scrolled or focused into view lands below the bar. The bar wraps to more rows on narrower screens
   and is not sticky on a phone (0 then), so it is measured rather than hard-coded. */
(() => {
  const bar = document.querySelector(".topbar"), root = document.documentElement;
  const update = () => root.style.setProperty("--topbar-h", getComputedStyle(bar).position === "sticky" ? `${Math.ceil(bar.getBoundingClientRect().height)}px` : "0px");
  update();
  if (window.ResizeObserver) new ResizeObserver(update).observe(bar);
  window.addEventListener("resize", update);  // the bar turns static at the phone breakpoint, which need not change its size
})();

try { if (localStorage.getItem("tp-dev") === "1") { $("#devToggle").checked = true; document.body.classList.add("dev"); } } catch {}
(async function boot() {
  try {
    if (TENANT_MODE) {
      document.body.classList.add("tenant");
      try { const kept = localStorage.getItem("tp-intake-lang"); if (kept && kept in I18N) S.intake.lang = kept; } catch {}  // bug 8
      await refresh(["intake"]); return;
    }
    await ensureCase();
    await refresh();
  } catch (err) { if (err.status === 401 && !TENANT_MODE) showLogin(); else toast(err.message); }
})();
</script>
