<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TenantProof</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;600&display=swap">
<style>
/* Layout: clinic case-file workspace. Sticky app bar; caseload table as home; numbered workflow rail inside a case; tenant intake shown in a phone frame. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#E9EEEC; --line:#D3DBD8;
  --ink:#16201D; --ink-2:#465450; --ink-3:#6A7773;
  --accent:#1D4F91; --accent-ink:#FFFFFF; --accent-soft:#E2EBF7;
  --ok:#2C6D45; --ok-soft:#E0F0E6; --warn:#8F5506; --warn-soft:#FAEED7; --bad:#A3241C; --bad-soft:#F8E2DF;
  --tag:#F6E7A8; --tag-ink:#4A3B00;
  --font-ui:"Public Sans", "Noto Sans SC", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1513; --surface:#161E1B; --surface-2:#1E2824; --line:#2D3935;
    --ink:#E5ECE9; --ink-2:#ADBAB5; --ink-3:#85928D;
    --accent:#8DB2EC; --accent-ink:#0C1830; --accent-soft:#1B2A41;
    --ok:#7FC897; --ok-soft:#1A2F22; --warn:#E8B166; --warn-soft:#382A13; --bad:#F2928A; --bad-soft:#3B1C19;
    --tag:#5A4B12; --tag-ink:#F8EBB8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#161E1B; --surface-2:#1E2824; --line:#2D3935;
  --ink:#E5ECE9; --ink-2:#ADBAB5; --ink-3:#85928D;
  --accent:#8DB2EC; --accent-ink:#0C1830; --accent-soft:#1B2A41;
  --ok:#7FC897; --ok-soft:#1A2F22; --warn:#E8B166; --warn-soft:#382A13; --bad:#F2928A; --bad-soft:#3B1C19;
  --tag:#5A4B12; --tag-ink:#F8EBB8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-size:.82em;font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-3);font-size:13px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:17px;text-decoration:none;color:var(--ink)}
.brand-mark{width:26px;height:26px;border-radius:5px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:800}
.ctx{display:flex;flex-direction:column;min-width:0;flex:1 1 240px}
.ctx strong{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.ctx span{font-size:12.5px;color:var(--ink-3)}
.topnav{display:flex;gap:2px;flex-wrap:wrap}
.topnav a{font-size:13.5px;font-weight:600;color:var(--ink-2);text-decoration:none;padding:6px 10px;border-radius:5px}
.topnav a:hover{background:var(--surface-2)}
.topnav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.topbar-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.demo-pill{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--tag);color:var(--tag-ink);padding:3px 8px;border-radius:3px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);position:relative;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ink-3);transition:transform .15s}
.switch input:checked{background:var(--accent-soft);border-color:var(--accent)}
.switch input:checked::after{transform:translateX(14px);background:var(--accent)}

/* layout */
.layout{max-width:1200px;margin:0 auto;padding-block:22px 60px;display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;align-items:start}
.layout.single{grid-template-columns:minmax(0,1fr)}
/* tenant mode (/i/{token}): phone-only intake, no caseworker chrome */
body.tenant .view-head, body.tenant .intake-side, body.tenant details.contract, body.tenant #topnav, body.tenant label[for="devToggle"]{display:none}
body.tenant .intake-wrap{grid-template-columns:minmax(0,420px);justify-content:center}
.layout.single .rail{display:none}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);display:flex;flex-direction:column;gap:2px}
.rail-back{font-size:13px;font-weight:600;text-decoration:none;color:var(--accent);padding:0 10px 10px}
.rail-label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:0 10px 8px}
.step-link{display:grid;grid-template-columns:26px 1fr;gap:2px 10px;align-items:start;padding:9px 10px;border-radius:var(--r);text-decoration:none;color:var(--ink);border:1px solid transparent}
.step-link:hover{background:var(--surface)}
.step-link[aria-current="page"]{background:var(--surface);border-color:var(--line)}
.step-no{grid-row:span 2;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.step-link[aria-current="page"] .step-no{border-color:var(--accent);color:var(--accent)}
.step-link.is-done .step-no{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.step-link.is-attn .step-no{border-color:var(--warn);color:var(--warn)}
.step-name{font-weight:600;font-size:14px}
.step-meta{font-size:12.5px;color:var(--ink-3)}
.step-link.is-attn .step-meta{color:var(--warn)}

main{min-width:0;display:flex;flex-direction:column;gap:20px}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.view-head h1{margin:0;font-size:26px;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
.view-head p{margin:4px 0 0;color:var(--ink-2);max-width:64ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-pad{padding:18px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:var(--r);padding:10px 12px}
.note b{color:var(--ink)}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.note.bad{background:var(--bad-soft);color:var(--ink)}
.note-ico{flex:none;font-weight:800;width:18px;text-align:center}
.section-h{margin:4px 0 0;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{color:var(--ok)} .btn.bad{color:var(--bad)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.plain::before{display:none}
.exhibit{display:inline-block;font-family:var(--font-mono);font-size:11.5px;font-weight:500;background:var(--tag);color:var(--tag-ink);padding:1px 6px;border-radius:3px;letter-spacing:.02em}

/* caseload */
.summary-row{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;color:var(--ink-2)}
.summary-row b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:18px;margin-right:4px}
.cl{display:flex;flex-direction:column}
.cl-head,.cl-row{display:grid;grid-template-columns:6px minmax(0,2.2fr) minmax(0,1.1fr) minmax(0,1.5fr) minmax(0,1fr) minmax(0,.8fr);gap:8px 16px;align-items:center}
.cl-head{padding:10px 18px 10px 0;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;border-bottom:1px solid var(--line)}
.cl-row{padding:0 18px 0 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.cl-row:last-child{border-bottom:0}
.cl-row:hover{background:var(--surface-2)}
.cl-row.demo{cursor:default;color:var(--ink-2)}
.cl-row.demo:hover{background:none}
.demo-tag{margin-left:8px;vertical-align:middle}
.cl-row > *{padding-block:13px}
.cl-stripe{align-self:stretch;padding:0!important;grid-row:span 2}
.cl-row.p-high .cl-stripe{background:var(--bad)}
.cl-who{display:flex;flex-direction:column;min-width:0}
.cl-who strong{font-size:14.5px}
.cl-who span{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.cl-dead{font-size:13px;display:flex;flex-direction:column;gap:2px}
.cl-dead small{color:var(--ink-3);font-size:12px}
.cl-dead .soon{color:var(--bad);font-weight:700}
.cl-open{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.cl-reason{grid-column:2 / -1;font-size:12.5px;color:var(--ink-3);padding-top:0!important;margin-top:-8px}
.cl-row.p-high .cl-reason{color:var(--bad)}

/* evidence */
.drop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border:1.5px dashed var(--line);border-radius:var(--r);padding:16px 18px;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:0;font-size:13.5px;color:var(--ink-2)}
.drop strong{display:block;color:var(--ink);font-size:14.5px}
.file-in{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.intake-panel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 18px;align-items:center}
.intake-panel .ip-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.intake-panel .ip-title{font-weight:700}
.linkbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.linkbox code{font-family:var(--font-mono);font-size:12px;background:var(--surface-2);padding:3px 8px;border-radius:4px;overflow-wrap:anywhere}
.ev-list{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.3fr) minmax(0,1fr);gap:8px 18px;padding:14px 18px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev-name{display:flex;flex-direction:column;gap:4px;min-width:0}
.ev-name .fn{font-weight:600;overflow-wrap:anywhere}
.ev-name .sub{font-size:12.5px;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 10px;font-size:12.5px;min-width:0;margin:0}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ev-checks{display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:12.5px}
.hash{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.copy{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0;font-weight:600}
.ev.is-new{background:var(--accent-soft)}

/* run */
.run-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.rs-unbuilt{color:var(--ink-3)}
.rs-unbuilt .rs-title{color:var(--ink-2)}
.send-hint{font-size:13px;margin:8px 0 0}
.run-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.run-steps{list-style:none;margin:0;padding:0}
.run-step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 14px;padding:16px 18px;border-top:1px solid var(--line)}
.run-step:first-child{border-top:0}
.rs-ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:1.5px solid var(--line);color:var(--ink-3)}
.rs-done .rs-ico{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.rs-running .rs-ico{border-color:var(--accent);color:var(--accent);animation:pulse 1s ease-in-out infinite}
.rs-needs_input .rs-ico{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.rs-failed .rs-ico{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--accent-soft)}}
@media (prefers-reduced-motion: reduce){.rs-running .rs-ico{animation:none}}
.rs-title{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:600}
.rs-sum{color:var(--ink-2);font-size:13.5px;margin:2px 0 0}
.ask{margin:0 0 14px;border-left:3px solid var(--warn)}
.ask h2{margin:0 0 6px;font-size:16px}
.ask-q{margin:0 0 12px;font-size:15px}
.ask label{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px}
.ask-row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.ask-row .field{flex:1 1 260px}
.ask-err{color:var(--bad);font-size:13.5px;margin:8px 0 0;min-height:1.3em}
.tools{grid-column:2;margin-top:6px}
.tools summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:600}
.tool-calls{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.tool-calls li{font-size:12.5px;background:var(--surface-2);border-radius:5px;padding:7px 10px;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 10px}
.tool-calls .t{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:500}
.tool-calls .io{overflow-wrap:anywhere;color:var(--ink-2)}
.tool-calls .io b{color:var(--ink);font-weight:600}

/* timeline */
.tl-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.meter{width:140px;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:96px;top:8px;bottom:8px;width:1.5px;background:var(--line)}
.tl-item{display:grid;grid-template-columns:84px minmax(0,1fr);gap:24px;padding:8px 0}
.tl-date{text-align:right;padding-top:15px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2);line-height:1.3}
.tl-date small{display:block;font-weight:500;color:var(--ink-3);font-size:11.5px}
.tl-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.tl-card::before{content:"";position:absolute;left:-17px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-3)}
.tl-item.st-accepted .tl-card::before,.tl-item.st-edited .tl-card::before{background:var(--ok);border-color:var(--ok)}
.tl-item.st-rejected .tl-card{opacity:.6}
.tl-item.st-rejected .tl-card::before{border-color:var(--bad)}
.tl-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.tl-title{font-weight:700;font-size:15px}
.tl-item.st-rejected .tl-title{text-decoration:line-through}
.tl-desc{margin:0;color:var(--ink-2);font-size:14px;max-width:70ch}
.cw-note{font-size:13px;background:var(--accent-soft);border-radius:5px;padding:7px 10px;color:var(--ink)}
.cw-note b{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips-label{font-size:12px;color:var(--ink-3);font-weight:600}
.src{font-size:12.5px}
.src summary{list-style:none;cursor:pointer;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:1px 7px 1px 2px;background:var(--surface)}
.src summary::-webkit-details-marker{display:none}
.src summary .loc{color:var(--ink-2)}
.src[open] summary{border-color:var(--accent)}
.src blockquote{margin:6px 0 2px;padding:6px 10px;border-left:3px solid var(--tag);background:var(--surface-2);font-size:13px;color:var(--ink-2);max-width:60ch}
.flags{display:flex;flex-direction:column;gap:4px}
.flag{font-size:12.5px;color:var(--warn);display:flex;gap:6px}
.flag::before{content:"!";font-weight:800;width:14px;text-align:center;flex:none}
.flag.conflict{align-items:flex-start;color:var(--ink);overflow-wrap:anywhere;white-space:normal}
.flag.conflict .pill{flex:none}
.flag.conflict::before{display:none}
.reasons{font-size:12.5px;color:var(--ink-3)}
.tl-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.tl-actions .state{font-size:12.5px;color:var(--ink-3);margin-right:auto}
.edit-form{display:grid;gap:8px}
.edit-form label{font-size:12.5px;font-weight:600;color:var(--ink-2);display:grid;gap:4px}
.field{width:100%;border:1px solid var(--line);border-radius:5px;background:var(--bg);padding:7px 10px;font-size:14px}
textarea.field{min-height:72px;resize:vertical}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

/* gaps */
.gap-group{display:flex;flex-direction:column;gap:10px}
.gap{display:grid;grid-template-columns:4px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gap-stripe{background:var(--ink-3)}
.gap.sev-blocking .gap-stripe{background:var(--bad)}
.gap.sev-recommended .gap-stripe{background:var(--warn)}
.gap.st-waiting_tenant .gap-stripe{background:var(--accent)}
.gap.st-resolved .gap-stripe,.gap.st-dismissed .gap-stripe{background:var(--ok)}
.gap-body{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.gap-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.gap-title{font-weight:700}
.gap p{margin:0;font-size:13.5px;color:var(--ink-2);max-width:68ch}
.gap p b{color:var(--ink);font-weight:600}
.gap-input{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gap-input .field{flex:1 1 240px}
.choices{display:flex;flex-direction:column;gap:6px}
.choices label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.gap.st-resolved .gap-title,.gap.st-dismissed .gap-title{color:var(--ink-2)}
.resolved-note{font-size:13px;color:var(--ok)}

}

        <span class="hash mono" title="${esc(e.sha256)}">SHA-256 ${esc(e.sha256.slice(0, 12))}…<button class="copy" type="button" data-action="copy" data-text="${esc(e.sha256)}">Copy</button></span></div>
      <dl class="kv">${mdRows}</dl>
      <div class="ev-checks">${fcPill}${proc}<span style="color:var(--ink-3)">${esc(fc.note)}</span></div></div>`;
  }).join("");
  return `<div class="view-head"><div><h1>Evidence</h1><p>Files come from the tenant's intake link or from you. Each gets an exhibit label, a SHA-256 fingerprint and a server receipt time. Location and device data are removed before anything goes to the AI model.</p></div></div>
    <div class="panel panel-pad intake-panel">
      ${!(S.case.tenant.preferred_language in I18N) ? `<div class="ip-main"><span class="ip-title">Tenant intake link · ${esc(LANGS[S.case.tenant.preferred_language])}</span><span class="muted">The tenant page has no ${esc(LANGS[S.case.tenant.preferred_language])} text yet, so no link can be sent or previewed for this case.</span></div>` : `
      <div class="ip-main"><span class="ip-title">Tenant intake link · ${esc(LANGS[S.case.tenant.preferred_language])}</span>
        <span class="muted">Sent ${fmtTime(ik.sent_at)} · last upload ${fmtTime(ik.last_upload_at)} · ${ik.tenant_attested_genuine ? `<span style="color:var(--ok)">tenant confirmed files are genuine</span>` : "not confirmed yet"}</span>
        ${ik.url || S.lastLink ? `<span class="linkbox"><code>${esc(ik.url || S.lastLink)}</code><button class="copy" type="button" data-action="copy" data-text="${esc(ik.url || S.lastLink)}">Copy link</button></span>` : `<span class="muted">The link is shown once, when you send it. Re-send to create a new link (the old one stops working).</span>`}</div>
      <div class="btn-row"><a class="btn" href="#intake">Open tenant view</a><button class="btn" type="button" data-action="resend">Re-send link</button></div>`}
    </div>
    <label class="drop" id="drop" for="fileIn"><input class="file-in" type="file" id="fileIn" multiple accept="${UPLOAD_ACCEPT}"><div><strong>Add files yourself</strong><p>For files the tenant brought to the clinic. JPG, PNG, HEIC, PDF or TXT, up to 25 MB each.</p></div><span class="btn primary">Choose files</span></label>
    <div class="panel ev-list">${rows}</div>
    ${contract("evidence", { intake: ik, evidence: S.evidence })}`;
}

function viewRun() {
  const run = S.run;
  if (!run) return `<div class="view-head"><div><h1>Agent run</h1><p>No analysis yet.</p></div><button class="btn primary" data-action="run">Run analysis</button></div>`;
  const ico = { pending: "", running: "…", done: "✓", needs_input: "!", failed: "×" };
  const pill = { pending: `<span class="pill">Waiting</span>`, running: `<span class="pill info">Running</span>`, done: `<span class="pill ok">Done</span>`, needs_input: `<span class="pill warn">Needs your input</span>`, failed: `<span class="pill bad">Failed</span>` };
  const runPill = `<span class="pill ${runState(run).pill[0]}">${runState(run).pill[1]}</span>`;
  // The runner builds `extract` and `timeline`; the other four steps are not built in this prototype,
  // whatever a seeded or real run says about them. (The mock run is a scripted demo and keeps its steps.)
  const unbuilt = s => !USE_MOCK && !RESUMABLE.includes(s.key);
  const steps = run.steps.map((s, i) => unbuilt(s) ? `<li class="run-step rs-unbuilt"><span class="rs-ico">–</span>
      <div><div class="rs-title">${i + 1}. ${esc(s.label)} <span class="pill plain">Not in this prototype</span></div></div></li>`
    : `<li class="run-step rs-${s.status}"><span class="rs-ico">${ico[s.status] || i + 1}</span>
      <div><div class="rs-title">${i + 1}. ${esc(s.label)} ${pill[s.status]}</div>${s.summary ? `<p class="rs-sum">${esc(s.summary)}</p>` : ""}</div>
      ${s.tool_calls.length ? `<details class="tools"${s.status === "needs_input" ? " open" : ""}><summary>${plural(s.tool_calls.length, "tool call")}</summary><ul class="tool-calls">${s.tool_calls.map(t => `<li><span class="t">${esc(t.tool)}</span><span class="io"><b>${esc(t.input)}</b> → ${esc(t.output)}</span></li>`).join("")}</ul></details>` : ""}</li>`).join("");
  const asking = run.steps.find(s => s.status === "needs_input" && RESUMABLE.includes(s.key));
  const ask = asking ? `<form class="panel panel-pad ask" data-action="answer" aria-labelledby="ask-title" novalidate>
      <h2 id="ask-title">The agent has a question for you</h2>
      <p class="ask-q" id="ask-q">${esc(asking.summary || "The agent needs your answer to carry on.")}</p>
      <label for="ask-a">Your answer</label>
      <div class="ask-row"><input class="field" id="ask-a" name="answer" type="text" maxlength="500" autocomplete="off" aria-describedby="ask-q ask-help ask-err" aria-invalid="${S.askError ? "true" : "false"}" value="${esc(S.askDraft)}"><button class="btn primary" type="submit"${S.answering ? " disabled" : ""}>${S.answering ? "Sending…" : "Send"}</button></div>
      <p class="muted" id="ask-help">Plain words are fine. If it asks for a date, write it like 2026-11-21 or Nov 21, 2026.</p>
      <p class="ask-err" id="ask-err" role="alert">${esc(S.askError)}</p>
    </form>` : "";
  const waiting = run.status === "needs_review" && !asking && !USE_MOCK ? `<div class="note"><span class="note-ico">i</span><span>The run has finished. Check the events on <a href="#timeline">Review timeline</a>. Steps marked "Not in this prototype" are not built yet.</span></div>` : run.status === "needs_review" && !asking ? `<div class="note warn"><span class="note-ico">!</span><span>The agent stopped at <b>Find missing information</b>. It drafted requests to the tenant in their language but sends nothing until you approve. It never decides the remedy. <a href="#gaps">Go to missing info</a></span></div>` : "";
  return `<div class="view-head"><div><h1>Agent run</h1><p>What the agent did, step by step, and which tools it used.</p></div><div class="btn-row">${run.status === "running" ? "" : briefButton()}<button class="btn" data-action="run" ${run.status === "running" ? "disabled" : ""}>Run analysis again</button></div></div>
    <div class="panel panel-pad run-head"><div class="btn-row"><span class="mono">${esc(run.id)}</span>${runPill}</div><div class="run-meta"><span>Started ${fmtTime(run.started_at)}</span><span>Finished ${fmtTime(run.finished_at)}</span>${run.usage ? `<span>Took ${fmtDur(run.usage.duration_ms)}</span><span title="${esc(costNote(run.usage))}">${esc(costLabel(run.usage))}</span>` : ""}</div></div>
    ${ask}${waiting}<ol class="panel run-steps">${steps}</ol>${contract("run", run)}`;
}

function viewTimeline() {
  const st = stats(), pct = st.total ? Math.round(st.reviewed / st.total * 100) : 0;
  const strengthPill = { corroborated: `<span class="pill ok">Corroborated</span>`, single_source: `<span class="pill plain">Single source</span>`, needs_support: `<span class="pill warn">Needs support</span>` };
  const actor = { tenant: "Tenant", landlord: "Landlord", other: "" };
  const items = S.timeline.map(e => {
    const editing = S.editing === e.id;
    const stateTxt = { pending: "Not reviewed", accepted: `Accepted by ${e.reviewed_by}`, edited: `Edited by ${e.reviewed_by}`, rejected: "Rejected. Left out of the form." }[e.review_status];
    const body = editing ? `<form class="edit-form" data-action="save-edit" data-id="${e.id}">
        <label>Title<input class="field" id="ed-title-${e.id}" name="title" value="${esc(e.title)}"></label>
        <label>What happened (goes into the form)<textarea class="field" id="ed-desc-${e.id}" name="description">${esc(e.description)}</textarea></label>
        <label>Date<input class="field" id="ed-date-${e.id}" type="date" name="date" value="${e.date.precision === "day" ? esc(e.date.value) : ""}"></label>
        <label>Caseworker note (internal, never shown to the tenant or put in the form)<textarea class="field" id="ed-note-${e.id}" name="caseworker_note">${esc(e.caseworker_note || "")}</textarea></label>
        <div class="btn-row"><button class="btn primary small" type="submit">Save</button><button class="btn small" type="button" data-action="cancel-edit">Cancel</button></div></form>`
      : `<p class="tl-desc">${esc(e.description)}</p>${e.caseworker_note ? `<div class="cw-note"><b>Note</b>${esc(e.caseworker_note)}</div>` : ""}`;
    const actions = e.review_status === "pending"
      ? `<button class="btn small ok" data-action="review" data-id="${e.id}" data-status="accepted">Accept</button><button class="btn small" data-action="edit" data-id="${e.id}">Edit or add note</button><button class="btn small bad" data-action="review" data-id="${e.id}" data-status="rejected">Reject</button>`
      : `<button class="btn small" data-action="review" data-id="${e.id}" data-status="pending">Undo</button>${e.review_status !== "rejected" ? `<button class="btn small" data-action="edit" data-id="${e.id}">Edit or add note</button>` : ""}`;
    return `<li class="tl-item st-${e.review_status}"><div class="tl-date">${esc(fmtDate(e.date))}<small>${esc(BASIS[e.date.basis] || "")}</small></div>
      <div class="tl-card"><div class="tl-top"><span class="tl-title">${esc(e.title)}</span><span class="chips">${actor[e.actor] ? `<span class="pill plain">${actor[e.actor]}</span>` : ""}${strengthPill[e.strength]}</span></div>
        ${body}<div class="chips"><span class="chips-label">Based on</span>${srcChips(e.sources)}</div>
        ${e.flags.length ? `<div class="flags">${e.flags.map(f => f.type === "conflict" ? `<span class="flag conflict"><span class="pill bad">Conflict</span>${esc(f.message)}</span>` : `<span class="flag">${esc(f.message)}</span>`).join("")}</div>` : `<div class="reasons">${esc(e.strength_reasons.join(" · "))}</div>`}
        ${editing ? "" : `<div class="tl-actions"><span class="state">${esc(stateTxt)}</span>${actions}</div>`}</div></li>`;
  }).join("");
  return `<div class="view-head"><div><h1>Review timeline</h1><p>The agent built this from the tenant's files. Check each event and add your professional notes. Only events you accept or edit go into the form draft.</p></div></div>
    <div class="tl-bar"><div class="progress"><span class="meter"><i style="width:${pct}%"></i></span>${st.reviewed} of ${st.total} reviewed</div>
      <div class="btn-row"><button class="btn small" data-action="accept-all">Accept all corroborated and single-source</button></div></div>
    <div class="note"><span class="note-ico">i</span><span><b>Strength is rule-based, not an AI guess.</b> Corroborated means two or more independent files agree. Needs support means the files are weak or disagree.</span></div>
    <ol class="tl">${items}</ol>${contract("timeline", S.timeline)}`;
}

function viewGaps() {
  const src = id => S.sources.find(s => s.id === id);
  const gapCard = g => {
    const s = src(g.source_id), open = g.status === "open";
    let input = "";
    if (open && g.input && g.input.type === "text") input = `<form class="gap-input" data-action="resolve-text" data-id="${g.id}"><input class="field" id="gap-in-${g.id}" name="value" placeholder="${esc(g.input.placeholder)}" required><button class="btn primary small" type="submit">Save</button></form>`;
    if (open && g.input && g.input.type === "choice") input = `<form data-action="resolve-choice" data-id="${g.id}" style="display:grid;gap:10px"><span class="muted">Record the tenant's choice:</span><div class="choices">${g.input.options.map((o, i) => `<label><input type="checkbox" id="gap-${g.id}-${i}" name="opt" value="${esc(o)}">${esc(o)}</label>`).join("")}</div><div class="btn-row"><button class="btn primary small" type="submit">Save tenant's choice</button></div></form>`;
    const draft = open && g.tenant_request && S.drafting === g.id ? `<div class="draft"><span class="draft-h">Draft to ${esc(S.case.tenant.name)} · ${esc(LANGS[g.tenant_request.language])} · written by the agent</span>
        <p class="draft-msg" lang="${esc(g.tenant_request.language)}">${esc(g.tenant_request.message)}</p><p class="draft-en"><b>English:</b> ${esc(g.tenant_request.message_en)}</p>
        <div class="btn-row"><button class="btn primary small" data-action="send-request" data-id="${g.id}">Approve and send through intake link</button><button class="btn small" data-action="cancel-draft">Cancel</button></div></div>` : "";
    const status = g.status === "resolved" ? `<span class="pill ok">Resolved</span>` : g.status === "dismissed" ? `<span class="pill plain">Dismissed</span>` : g.status === "waiting_tenant" ? `<span class="pill info">Waiting for tenant</span>` : g.severity === "blocking" ? `<span class="pill bad">Required</span>` : `<span class="pill warn">Suggested</span>`;
    const acts = [];
    if (open && g.tenant_request && S.drafting !== g.id) acts.push(`<button class="btn small" data-action="draft" data-id="${g.id}">Ask tenant</button>`);
    if (open && g.severity === "recommended") acts.push(`<button class="btn small ok" data-action="gap" data-id="${g.id}" data-status="resolved">Mark done</button><button class="btn small" data-action="gap" data-id="${g.id}" data-status="dismissed">Dismiss</button>`);
    if (g.status === "waiting_tenant" && g.severity === "recommended") acts.push(`<button class="btn small ok" data-action="gap" data-id="${g.id}" data-status="resolved">Tenant replied · mark done</button>`);
    if (!open) acts.push(`<button class="btn small" data-action="gap" data-id="${g.id}" data-status="open">Reopen</button>`);
    return `<div class="gap sev-${g.severity} st-${g.status}"><span class="gap-stripe"></span><div class="gap-body">
      <div class="gap-top"><span class="gap-title">${esc(g.title)}</span>${status}</div>
      ${open ? `<p>${esc(g.why)}</p><p><b>How to fix:</b> ${esc(g.how_to_fix)}</p>` : g.resolution_note ? `<span class="resolved-note">${esc(g.resolution_note)}</span>` : ""}
      ${s && open ? `<p style="font-size:12.5px;color:var(--ink-3)">Source: ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}</p>` : ""}
      ${g.status === "waiting_tenant" && g.input && g.input.type === "text" ? `<form class="gap-input" data-action="resolve-text" data-id="${g.id}"><input class="field" id="gap-in-${g.id}" name="value" placeholder="Enter the tenant's answer" required><button class="btn primary small" type="submit">Save answer</button></form>` : ""}
      ${input}${draft}${acts.length ? `<div class="btn-row">${acts.join("")}</div>` : ""}</div></div>`;
  };
  const vs = { unchanged: `<span class="pill ok">Checked · unchanged</span>`, changed: `<span class="pill warn">Changed since saved</span>`, unreachable: `<span class="pill bad">Link unreachable</span>`, unverified: `<span class="pill plain">Not verified yet</span>` };
  return `<div class="view-head"><div><h1>Missing info</h1><p>Required items block the package. For anything only the tenant knows, the agent drafts a message in the tenant's language. You approve it before it's sent.</p></div></div>
    <section class="gap-group"><h2 class="section-h">Required</h2>${S.gaps.filter(g => g.severity === "blocking").map(gapCard).join("")}</section>
    <section class="gap-group"><h2 class="section-h">Suggestions to strengthen evidence</h2>${S.gaps.filter(g => g.severity === "recommended").map(gapCard).join("")}</section>
    <section class="gap-group"><h2 class="section-h">Official sources the agent used</h2>
      <ul class="panel sources">${S.sources.map(s => `<li><span class="s-title">${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}</span>${vs[s.verify_status]}<span class="s-sub">${esc(s.used_for)}${s.last_verified_at ? ` · last checked ${fmtTime(s.last_verified_at)}` : ""}</span></li>`).join("")}</ul>
      <div class="note"><span class="note-ico">i</span><span>These are saved copies of official sources. This prototype does not open the original links or check them for changes, so confirm each source on its official page before you rely on it.</span></div></section>
    ${contract("gaps", { gaps: S.gaps, sources: S.sources })}`;
}

function viewForm() {
  const f = S.form;
  const stPill = { auto_filled: `<span class="pill info">Filled from files</span>`, needs_confirmation: `<span class="pill warn">Please confirm</span>`, missing: `<span class="pill bad">Missing</span>`, user_entered: `<span class="pill ok">Entered by caseworker</span>` };
  const rows = f.fields.map(x => `<div class="frow"><div class="fl">${esc(x.label)}${x.required ? "<small>Required</small>" : ""}</div>
      <div style="display:grid;gap:6px;min-width:0"><input class="field" id="fld-${x.key}" data-action="field" data-key="${x.key}" value="${esc(x.value || "")}" placeholder="${x.status === "missing" ? "Not found in the files" : ""}">
        ${x.note ? `<span class="flag">${esc(x.note)}</span>` : ""}${x.sources.length ? `<div class="chips">${srcChips(x.sources)}</div>` : ""}</div>
      <div class="fs">${stPill[x.status]}</div></div>`).join("");
  const narrHtml = esc(f.narrative.text.replace(/\[([^\]]+)\]/g, "⟦$1⟧")).replace(/⟦([^⟧]+)⟧/g, `<span class="narr-cite">[$1]</span>`);
  const left = S.timeline.filter(e => e.review_status === "pending").length;
  return `<div class="view-head"><div><h1>Form draft</h1><p>${esc(f.form_name)}. Check every field against the official form with the tenant before filing.</p></div></div>
    <div class="note warn"><span class="note-ico">!</span><span>${esc(f.disclaimer)}</span></div>
    <div class="panel form-grid">${rows}</div>
    <h2 class="section-h">Details of the problem</h2>
    <div class="panel panel-pad" style="display:grid;gap:10px">${f.narrative.text ? `<p class="narr">${narrHtml}</p>` : `<p class="narr">No accepted events yet.</p>`}
      <span class="muted">Built from ${f.narrative.event_ids.length} accepted events. Caseworker notes are never included. ${left ? `<a href="#timeline">${left} events still need review</a> and are left out.` : "All events reviewed."}</span></div>
    ${contract("form", f)}`;
}

function viewPackage() {
  const st = stats(), ik = S.case.intake;
  const doneRun = S.run && ["done", "needs_review"].includes(S.run.status) && S.run.finished_at;
  const acceptedN = S.timeline.filter(e => ["accepted", "edited"].includes(e.review_status)).length;
  // Same two reasons, same words, as the server's 409 (services/package.py).
  const noAnalysis = !doneRun ? "No analysis has been completed for this case yet. Run the analysis first." : !acceptedN ? "No timeline events have been accepted yet. Review the timeline first." : null;
  const ready = !noAnalysis && !st.blocking && !st.reqMissing && ik.tenant_attested_genuine;
  const allAttest = Object.values(S.attest).every(Boolean);
  const ck = (ok, warn) => `<span class="ck ${ok ? "yes" : warn ? "maybe" : "no"}">${ok ? "✓" : warn ? "!" : "×"}</span>`;
  const pc = packageChecks(st), mark = { yes: "✓", no: "×", maybe: "!", none: "–" };
  const row = (c, label) => `<li><span class="ck ${c.state}">${mark[c.state]}</span><span>${label}: ${c.href ? `<a href="${c.href}">${esc(c.text)}</a>` : esc(c.text)}</span></li>`;
  const whoCls = { agent: "who-agent", tenant: "who-tenant", caseworker: "who-caseworker" };
  const manifest = S.pkg ? `<h2 class="section-h">Package contents</h2>
    <div class="panel tbl-wrap"><table class="manifest"><thead><tr><th>Exhibit</th><th>File</th><th>SHA-256</th><th>Note</th></tr></thead><tbody>${S.pkg.files.map(r => `<tr><td>${r.label === "—" ? "—" : `<span class="exhibit">${esc(r.label)}</span>`}</td><td>${esc(r.filename)}</td><td class="mono">${esc(r.sha256.length === 64 ? r.sha256.slice(0, 16) + "…" : r.sha256)}</td><td>${esc(r.note)}</td></tr>`).join("")}</tbody></table></div>
    <div class="note"><span class="note-ico">i</span><span>Version ${S.pkg.version} · prepared by ${esc(S.pkg.prepared_by)} · ${fmtTime(S.pkg.built_at)}. ${USE_MOCK ? "In the real app this downloads as one zip." : `<a href="${API_BASE}${C}/package/download?version=${S.pkg.version}" download>Download the zip (v${S.pkg.version})</a> · SHA-256 <span class="mono">${esc(S.pkg.sha256.slice(0, 16))}…</span>`}</span></div>
    <div class="panel panel-pad"><ul class="checklist">${S.pkg.reminders.map(r => `<li><span class="ck maybe">!</span>${esc(r)}</li>`).join("")}</ul></div>` : "";
  return `<div class="view-head"><div><h1>Package</h1><p>Bundle the form draft, the evidence and a fingerprint log for filing. The tenant or the clinic files it. TenantProof never submits anything.</p></div>${briefButton()}</div>
    <div class="panel panel-pad"><ul class="checklist">
      <li>${ck(!noAnalysis)}<span>Analysis: ${noAnalysis ? `<a href="${doneRun ? "#timeline" : "#run"}">${esc(noAnalysis)}</a>` : "done, with accepted events"}</span></li>
      ${row(pc.missing, "Required missing info")}
      ${row(pc.fields, "Required form fields")}
      <li>${ck(ik.tenant_attested_genuine)}<span>Tenant confirmed the files are genuine${ik.tenant_attested_at ? ` (${fmtTime(ik.tenant_attested_at)}, intake link)` : ""}</span></li>
      ${row(pc.timeline, "Timeline review")}
      ${row(pc.suggestions, "Suggestions")}</ul></div>
    <form class="panel panel-pad attest" data-action="attest">
      <label><input type="checkbox" id="at-reviewed" name="reviewed_fields" ${S.attest.reviewed_fields ? "checked" : ""}>I reviewed every field and the summary.</label>
      <label><input type="checkbox" id="at-remedy" name="remedy_confirmed_with_tenant" ${S.attest.remedy_confirmed_with_tenant ? "checked" : ""}>The tenant confirmed what they are asking for.</label>
      <label><input type="checkbox" id="at-legal" name="explained_not_legal_advice" ${S.attest.explained_not_legal_advice ? "checked" : ""}>I told the tenant this package is prepared information, not a decision about their case.</label></form>
    ${S.pkgError ? `<div class="note bad"><span class="note-ico">×</span><span>${esc(S.pkgError)}</span></div>` : ""}
    <div class="btn-row"><button class="btn primary" data-action="build" ${ready && allAttest ? "" : "disabled"}>Build package</button>${!ready ? `<span class="muted">${esc(noAnalysis || "Resolve the required items first.")}</span>` : !allAttest ? `<span class="muted">Tick all three confirmations.</span>` : ""}</div>
    ${manifest}
    <h2 class="section-h">Audit log</h2>
    <ul class="panel log">${S.activity.map(a => `<li><time>${fmtTime(a.at)}</time><span class="who ${whoCls[a.actor]}">${esc(a.actor)}</span><span>${esc(a.action)}${a.actor !== "agent" ? ` <span class="muted">· ${esc(a.actor_name)}</span>` : ""}</span></li>`).join("")}</ul>
    ${contract("package", { request: { attestations: S.attest }, response: S.pkg, activity: S.activity })}`;
}

/* ---------- tenant intake ---------- */
function viewIntake() {
  const v = S.intake.view; if (!v) return "<p>Loading…</p>";
  if (v.noLink) return `<div class="view-head"><div><h1>Tenant view</h1><p>Send the intake link first, then you can preview what the tenant sees. For security the link is only shown when it is created.</p></div></div><div class="btn-row"><button class="btn primary" type="button" data-action="resend">Send intake link</button></div>`;
  const lang = S.intake.lang || v.language, t = I18N[lang] || I18N.en, vars = { org: v.org_name, unit: v.unit };
  const reqs = v.requests.map(r => `<div class="req"><b>${esc(tpl(t.req, vars))}</b>${esc(r.message ?? "")}</div>`).join("");
  const body = S.intake.sent ? `<div class="done">${esc(tpl(t.sent, vars))}</div>` : `
      <p>${esc(tpl(t.intro, vars))}</p>${reqs}
      <div><strong style="font-size:14.5px">${esc(t.what)}</strong><ul>${t.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>
      ${UPLOADS_ENABLED ? `<label class="up" for="intakeFiles"><input class="file-in" type="file" id="intakeFiles" multiple accept="${UPLOAD_ACCEPT}">${S.intake.files.length ? esc(tpl(t.selected, { n: S.intake.files.length })) : esc(t.choose)}</label>` : `<p class="muted">${esc(UPLOAD_SOON[lang] || UPLOAD_SOON.en)}</p>`}
      <p style="font-size:13px">${esc(tpl(t.privacy, vars))}</p>
      <form class="attest" data-action="intake-attest">
        <label><input type="checkbox" id="in-attest" name="attest" ${S.intake.attest ? "checked" : ""}>${esc(t.attest)}</label>
        <label><input type="checkbox" id="in-consent" name="consent" ${S.intake.consent ? "checked" : ""}>${esc(tpl(t.consent, vars))}</label></form>
      ${(() => { const ok = (S.intake.files.length || !UPLOADS_ENABLED) && S.intake.attest && S.intake.consent;
        return `<button class="btn primary" data-action="intake-send" ${ok ? "" : `disabled aria-describedby="send-hint"`}>${esc(tpl(t.send, vars))}</button>${ok ? "" : `<p class="muted send-hint" id="send-hint">${esc(t.sendHint)}</p>`}`; })()}`;
  return `<div class="view-head"><div><h1>Tenant view</h1><p>What ${esc(v.tenant_first_name)} sees after opening the intake link on a phone. No account needed. It opens in the tenant's preferred language, and the tenant never sees the caseworker workspace.</p></div></div>
    <div class="intake-wrap">
      <div class="intake-side">
        <div class="note"><span class="note-ico">i</span><span>Requests you approve on <a href="#gaps">Missing info</a> appear here in the tenant's language. Files sent here show up in the case as <b>Uploaded by tenant</b>.</span></div>
        <div class="note"><span class="note-ico">i</span><span>The four languages in this prototype are examples. Agent-drafted requests are written in the tenant's language by the model; fixed page text should be checked by a native speaker.</span></div>
        ${S.intake.sent ? `<div class="btn-row"><a class="btn" href="#evidence">See the files in the case</a><button class="btn" data-action="intake-reset">Reset tenant view</button></div>` : ""}
      </div>
      <div class="phone" lang="${esc(lang)}">
        <div class="phone-top"><span class="phone-org">${esc(v.org_name)}</span><label class="muted" for="intakeLang">${esc(t.lang)} <select class="lang" id="intakeLang">${Object.keys(I18N).map(k => `<option value="${k}" ${k === lang ? "selected" : ""}>${LANGS[k]}</option>`).join("")}</select></label></div>
        <h2>${esc(t.title)}</h2>${body}
      </div>
    </div>
    ${contract("intake", v)}`;
}

const VIEWS = { cases: viewCases, intake: viewIntake, evidence: viewEvidence, run: viewRun, timeline: viewTimeline, gaps: viewGaps, form: viewForm, package: viewPackage };
function render() {
  if (S.needLogin) return showLogin();
  if (!TENANT_MODE && !CASE_ID && route() !== "cases") { location.hash = "cases"; return; }  // hashchange re-renders
  renderChrome();
  const r = route();
  const here = S.cases.find(x => x.id === CASE_ID);
  const banner = CASE_ROUTES.includes(r) && here && here.analysed === false ? `<div class="note warn" role="status"><span class="note-ico">!</span><span><b>Not analysed yet.</b> No analysis has been completed and no events are reviewed, so nothing here is ready to file. <a href="#run">Run the analysis</a></span></div>` : "";
  $("#view").innerHTML = (r === "cases" ? S.casesLoaded : r === "intake" ? S.intake.view : S.form) ? banner + VIEWS[r]() : `<p>Loading…</p>`;
  if (r === "evidence") wireDrop();
}

/* ---------- data loading ---------- */
let C = `/cases/${CASE_ID}`;
const setCase = id => { CASE_ID = id; C = `/cases/${id}`; };
// The server returns the raw link only from POST /intake-link, so a caseworker can preview
// the tenant view only after sending a link in this session.
const tokenOf = url => (url ? url.split("/").pop() : null);
const intakeTok = () => INTAKE_TOKEN || tokenOf(S.lastLink || (S.case && S.case.intake.url));
const LOADERS = {
  me: () => request("GET", "/me").then(d => S.me = d),
  cases: () => request("GET", "/cases").then(d => { S.cases = prioritizeClient(d); S.casesLoaded = true; }),
  case: () => request("GET", C).then(d => S.case = d),
  evidence: () => request("GET", `${C}/evidence`).then(d => S.evidence = d),
  run: () => request("GET", `${C}/runs/latest`).then(d => S.run = d).catch(() => S.run = null),
  timeline: () => request("GET", `${C}/timeline`).then(d => S.timeline = d),
  gaps: () => request("GET", `${C}/gaps`).then(d => S.gaps = d),
  sources: () => request("GET", `${C}/sources`).then(d => S.sources = d),
  form: () => request("GET", `${C}/form-draft`).then(d => S.form = d),
  activity: () => request("GET", `${C}/activity`).then(d => S.activity = d),
  // A revoked or expired link is a 404 here; for the caseworker that means "send a new link", not "case gone".
  intake: async () => { const tok = intakeTok(); try { S.intake.view = tok ? await request("GET", `/intake/${tok}`) : { noLink: true }; } catch (err) { if (err.status === 404 && !TENANT_MODE) S.intake.view = { noLink: true }; else throw err; } }
};
function prioritizeClient(list) { return list.map(c => ({ ...c, _days: c.next_deadline ? Math.round((new Date(c.next_deadline.date + "T12:00:00") - new Date(plusDays(0) + "T12:00:00")) / 864e5) : null })); }
const CASELESS_LOADERS = ["me", "cases"];
// If the selected case is gone (404), forget it and go back to the caseload instead of an empty shell.
async function dropCase(why) {
  CASE_ID = null; C = ""; S.case = null; S.evidence = []; S.run = null; S.timeline = []; S.gaps = []; S.sources = []; S.form = null; S.activity = []; S.pkg = null;
  S.intake.view = null; S.lastLink = null;
  location.hash = "cases";
  toast(why || "That case isn't available. Back to your caseload.");
  await refresh(["cases"]);
}
async function refresh(parts) {
  let keys = TENANT_MODE ? ["intake"] : parts ? [...new Set([...parts, "activity", "cases"])] : Object.keys(LOADERS);
  if (!TENANT_MODE && !CASE_ID) keys = keys.filter(k => CASELESS_LOADERS.includes(k));
  try { await Promise.all(keys.map(k => LOADERS[k]())); }
  catch (err) {
    if (err.status === 401 && !TENANT_MODE) return showLogin();
    if (err.status === 404 && CASE_ID && !TENANT_MODE) return dropCase();
    toast(err.message);
  }
  render();
}

const focusAsk = () => { const el = $("#ask-a"); if (el) el.focus(); };
let poller = null;
function pollRun() {
  clearInterval(poller);
  poller = setInterval(async () => {
    S.run = await request("GET", `/runs/${S.run.id}`);
    if (S.run.status !== "running") {
      clearInterval(poller);
      const asked = S.run.steps.some(s => s.status === "needs_input" && RESUMABLE.includes(s.key));
      toast(asked ? "The agent has a question for you." : "Analysis finished. Required items need your input.");
      await refresh(["timeline", "gaps", "form", "evidence"]); if (asked && route() === "run") focusAsk(); return;
    }
    if (route() === "run") $("#view").innerHTML = viewRun();
    renderChrome();
  }, 700);
}

/* ---------- events ---------- */
/* ---------- case brief (PDF) ---------- */
const briefButton = () => USE_MOCK ? "" : `<button class="btn" type="button" data-action="brief">Case brief (PDF)</button>`;
async function openBrief() {
  try {
    const r = await fetch(`${API_BASE}${C}/case-brief`, { credentials: "include" });
    if (!r.ok) {
      let msg = "The case brief could not be built";
      try { const j = await r.json(); msg = (j.detail && j.detail.reasons ? j.detail.reasons.join(" ") : j.detail) || msg; } catch {}
      toast(msg); return;
    }
    showBrief(URL.createObjectURL(await r.blob()));
  } catch (err) { toast(err.message); }
}
function showBrief(url) {
  closeBrief();
  const d = document.createElement("div");
  d.id = "briefModal"; d.className = "modal"; d.dataset.url = url;
  d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true"); d.setAttribute("aria-label", "Case brief");
  d.innerHTML = `<div class="modal-card"><div class="modal-bar"><strong>Case brief</strong><span class="btn-row"><a class="btn small" href="${url}" download="case-brief-${esc(CASE_ID)}.pdf">Download</a><button class="btn small" type="button" data-action="close-brief">Close</button></span></div><iframe title="Case brief PDF" src="${url}"></iframe></div>`;
  document.body.appendChild(d);
  d.querySelector("button").focus();
}
function closeBrief() { const d = $("#briefModal"); if (d) { URL.revokeObjectURL(d.dataset.url); d.remove(); } }
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeBrief(); });

document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-action]");
  if (!b || b.tagName === "FORM" || b.tagName === "INPUT") return;
  const a = b.dataset.action, id = b.dataset.id;
  if (a === "logout") return logout();
  if (a === "brief") return openBrief();
  if (a === "close-brief") return closeBrief();
  if (a === "copy") { ev.preventDefault(); try { await navigator.clipboard.writeText(b.dataset.text); toast("Copied"); } catch { toast(b.dataset.text); } }
  if (a === "open-case") { const c = S.cases.find(x => x.id === id); if (c && c.has_demo_data) { if (id !== CASE_ID) { setCase(id); await refresh(); } location.hash = "timeline"; } }
  if (a === "new-case") toast("Creating cases isn't part of this prototype yet.");
  if (a === "resend") { const r = await request("POST", `${C}/intake-link`); S.lastLink = r.url; S.intake.view = null; toast("Intake link created. Copy it now: it is only shown once."); await refresh(["case", "intake"]); }
  if (a === "run") { S.run = await request("POST", `${C}/runs`); location.hash = "run"; render(); pollRun(); }
  if (a === "review") { await request("PATCH", `/timeline/${id}`, { review_status: b.dataset.status }); S.editing = null; await refresh(["timeline", "form"]); }
  if (a === "edit") { S.editing = id; render(); const el = document.getElementById("ed-desc-" + id); el && el.focus(); }
  if (a === "cancel-edit") { S.editing = null; render(); }
  if (a === "accept-all") {
    for (const e of S.timeline.filter(e => e.review_status === "pending" && e.strength !== "needs_support")) await request("PATCH", `/timeline/${e.id}`, { review_status: "accepted" });
    toast("Accepted. Events that need support were left for you."); await refresh(["timeline", "form"]);
  }
  if (a === "draft") { S.drafting = id; render(); }
  if (a === "cancel-draft") { S.drafting = null; render(); }
  if (a === "send-request") { await request("POST", `/gaps/${id}/tenant-request`); S.drafting = null; toast("Sent to the tenant's intake page"); await refresh(["gaps", "intake"]); }
  if (a === "gap") { const st = b.dataset.status; await request("PATCH", `/gaps/${id}`, { status: st, resolution_note: st === "resolved" ? "Marked done" : st === "dismissed" ? "Dismissed by caseworker" : null }); await refresh(["gaps", "form", "intake"]); }
  if (a === "build") {
    try { S.pkg = await request("POST", `${C}/package`, { attestations: S.attest }); S.pkgError = null; toast("Package built"); }
    catch (err) { S.pkgError = err.status === 409 ? `Can't build yet: ${err.message}.` : err.message; }
    await refresh([]);
  }
  if (a === "intake-send") {
    try {
      if (UPLOADS_ENABLED) await uploadFiles(`/intake/${intakeTok()}/files`, S.intake.files);
      await request("POST", `/intake/${intakeTok()}/submit`, { attest_genuine: S.intake.attest, consent_share: S.intake.consent, language: S.intake.lang || S.intake.view.language });
      S.intake.sent = true; await refresh(["evidence", "case"]);
    } catch (err) { toast(err.message); }
  }
  if (a === "intake-reset") { S.intake = { ...S.intake, files: [], attest: false, consent: false, sent: false }; render(); }
});
document.addEventListener("submit", async ev => {
  const f = ev.target; if (!f.dataset.action) return; ev.preventDefault();
  const id = f.dataset.id, a = f.dataset.action;
  if (a === "login") {
    const fd = new FormData(f);
    try { S.me = await request("POST", "/auth/login", { email: fd.get("email"), password: fd.get("password") }); S.needLogin = false; await ensureCase(); await refresh(); location.hash = "cases"; }
    catch (err) { showLogin(err.status === 429 ? "Too many attempts. Wait a minute and try again." : err.message); }
    return;
  }
  if (a === "answer") {
    if (S.answering || !S.run) return;
    const answer = new FormData(f).get("answer").trim();
    S.askDraft = answer;
    if (!answer) { S.askError = "Type an answer first."; $("#view").innerHTML = viewRun(); focusAsk(); return; }
    S.answering = true; S.askError = ""; $("#view").innerHTML = viewRun();
    try {
      S.run = await request("POST", `/runs/${S.run.id}/answer`, { answer });
      S.askDraft = ""; toast("Answer sent. The agent is carrying on.");
      S.answering = false; render(); pollRun();
    } catch (err) {
      S.answering = false;
      if (err.status === 409) { S.askError = ""; toast("That question was already answered."); try { S.run = await request("GET", `/runs/${S.run.id}`); } catch {} render(); if (S.run && S.run.status === "running") pollRun(); return; }
      S.askError = err.status === 422 ? err.message : "Could not send your answer. Check your connection and try again.";
      $("#view").innerHTML = viewRun(); focusAsk();
    }
    return;
  }
  if (a === "save-edit") {
    const fd = new FormData(f), date = fd.get("date"), ex = S.timeline.find(e => e.id === id);
    await request("PATCH", `/timeline/${id}`, { review_status: "edited", title: fd.get("title"), description: fd.get("description"), caseworker_note: fd.get("caseworker_note").trim() || null, date: date ? { value: date, precision: "day", basis: "user" } : ex.date });
    S.editing = null; toast("Saved"); await refresh(["timeline", "form"]);
  }
  if (a === "resolve-text") { const v = new FormData(f).get("value").trim(); if (!v) return; await request("PATCH", `/gaps/${id}`, { status: "resolved", value: v, resolution_note: `Saved: ${v}` }); toast("Saved to the form draft"); await refresh(["gaps", "form", "intake"]); }
  if (a === "resolve-choice") { const v = new FormData(f).getAll("opt"); if (!v.length) { toast("Pick at least one option"); return; } await request("PATCH", `/gaps/${id}`, { status: "resolved", value: v.join("; "), resolution_note: `Tenant's choice: ${v.join("; ")}` }); toast("Saved to the form draft"); await refresh(["gaps", "form"]); }
});
document.addEventListener("change", async ev => {
  const t = ev.target;
  if (t.id === "devToggle") { document.body.classList.toggle("dev", t.checked); try { localStorage.setItem("tp-dev", t.checked ? "1" : "0"); } catch {} return; }
  if (t.dataset.action === "field") { await request("PATCH", `${C}/form-draft/fields/${t.dataset.key}`, { value: t.value.trim() }); await refresh(["form", "gaps"]); }
  if (t.closest("form[data-action=attest]")) { S.attest[t.name] = t.checked; S.pkgError = null; render(); }
  if (t.closest("form[data-action=intake-attest]")) { S.intake[t.name] = t.checked; render(); }
  if (t.id === "intakeLang") { S.intake.lang = t.value; render(); }
  if (t.id === "intakeFiles" && t.files.length) { S.intake.files = [...t.files]; render(); }
  if (t.id === "fileIn" && t.files.length) handleFiles(t.files);
});
async function handleFiles(files) {
  try { await uploadFiles(`${C}/evidence`, [...files]); } catch (err) { toast(err.message); return; } /* WS1: an error toast is not overwritten */
  toast(`${plural(files.length, "file")} added. Run the analysis again to include them.`);
  await refresh(["evidence"]);
}
function wireDrop() {
  const d = $("#drop"); if (!d) return;
  d.addEventListener("dragover", e => { e.preventDefault(); d.classList.add("over"); });
  d.addEventListener("dragleave", () => d.classList.remove("over"));
  d.addEventListener("drop", e => { e.preventDefault(); d.classList.remove("over"); if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
}
window.addEventListener("hashchange", () => { S.editing = null; S.drafting = null; render(); window.scrollTo({ top: 0 }); });

try { if (localStorage.getItem("tp-dev") === "1") { $("#devToggle").checked = true; document.body.classList.add("dev"); } } catch {}
(async function boot() {
  try {
    if (TENANT_MODE) { document.body.classList.add("tenant"); await refresh(["intake"]); return; }
    await ensureCase();
    await refresh();
  } catch (err) { if (err.status === 401 && !TENANT_MODE) showLogin(); else toast(err.message); }
})();
</script>

</body></html>
