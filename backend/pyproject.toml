[project]
name = "tenantproof"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlmodel>=0.0.22",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.9",
  "argon2-cffi>=25.1.0",
  "slowapi>=0.1.10",
  "redis>=8.1.0",
  "fpdf2>=2.9.0",
  "anthropic>=0.99,<0.100",
  "rapidfuzz>=3.14.6",
  "pillow>=12.0",
  "pillow-heif>=1.1",
  "pypdf[crypto]>=7.0.0",
  "httpx>=0.27",
  "segno>=1.6",
  "rapidocr>=3.10",
  "onnxruntime>=1.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest-cov>=5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# PLW1514 (open() / read_text() without encoding) is preview-only; explicit-preview-rules
# turns on just the rules named here, not every preview rule.
preview = true
explicit-preview-rules = true
select = ["E", "F", "I", "B", "UP", "S", "PLW1514"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
